<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root { --bg:#1a1812; --tx:#f5f0e8; }

* { margin:0; padding:0; box-sizing:border-box; }

html,body{
  height:100%;
  background:var(--bg);
  color:var(--tx);
  font-family:'Lucida Console',monospace;
  user-select:none;
  overflow:hidden;
}

body{display:flex;align-items:center;justify-content:center;}

.page-frame{
  position:relative;
  --b:min(100vh,1200px);
  height:calc(var(--b)*1.20);
  width:calc(var(--b)*1.20*9/16);
  overflow:hidden;
}

.page-background{
  position:absolute;inset:0;
  background:url("Grafiken/Br%C3%BCcke.png") no-repeat;
  background-size:100% 100%;
  image-rendering:pixelated;
}

.page-content{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;
  padding:1.1rem;
}

.logo-img{
  width:70%;
  margin:0.2rem 0 1rem;
  image-rendering:pixelated;
}

/* ---------------- SLOT (NEUE robuste Version) ---------------- */

.slot-area{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ENTSCHEIDEND: KEIN overflow:hidden MEHR */
.slot-window{
  position:relative;
  width:100%;
  height:150px;         /* gigantischer vertikaler Atemraum */
  padding:0 60px;       /* horizontaler Innenraum */
  display:flex;
  justify-content:center;
}

/* Liste bleibt animierbar */
.slot-list{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:transform 170ms cubic-bezier(.32,.72,.23,1);
}

/* Items: nie wieder clipping */
.slot-item{
  height:42px;
  font-size:1.1rem;
  letter-spacing:0.1em;

  width:100%;
  padding:0 60px;      /* riesiger Innenraum */
  white-space:nowrap;  /* kein Zeilenumbruch */
  overflow:visible;    /* niemals abschneiden */

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0.3;
  transform:scale(0.9);
  transition:opacity 150ms, transform 150ms;
}

.slot-item.active{
  opacity:1;
  transform:scale(1.15);
}

/* Pfeile */
.arrow{
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  opacity:0.75;cursor:pointer;
}

.arrow-up{border-bottom:14px solid var(--tx);margin-bottom:8px;}
.arrow-down{border-top:14px solid var(--tx);margin-top:8px;}

.section-area{
  margin-top:2rem;
  font-size:1rem;
  opacity:0;
  transition:opacity 260ms ease-out;
}

.section-area.visible{opacity:1;}
</style>
</head>

<body>
<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">

    <img src="Grafiken/leerebruecke.png" class="logo-img"/>

    <div class="slot-area">
      <div class="arrow arrow-up" id="arrow-up"></div>

      <div class="slot-window">
        <div class="slot-list" id="slot-list">
          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>

          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>

          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>
        </div>
      </div>

      <div class="arrow arrow-down" id="arrow-down"></div>
    </div>

    <div class="section-area" id="section-area"></div>
  </div>
</div>

<script>
const base=["Musik","Gemälde","Unterstützung"];
const texts={
  Musik:"Dies ist ein Testtext für Musik.",
  Gemälde:"Dies ist ein Testtext für Gemälde.",
  Unterstützung:"Dies ist ein Testtext für Unterstützung."
};

const list=document.getElementById("slot-list");
const items=[...document.querySelectorAll(".slot-item")];
const out=document.getElementById("section-area");

const ITEM=42;
const WINDOW=150;
const CENTER=(WINDOW-ITEM)/2;

/* Startpunkt */
let visual=4;
let y=-(visual*ITEM)+CENTER;
list.style.transform=`translateY(${y}px)`;

function update(){
  items.forEach(i=>i.classList.remove("active"));
  items[visual].classList.add("active");
  const real=base[(visual%3+3)%3];
  out.classList.remove("visible");
  requestAnimationFrame(()=>{
    out.textContent=texts[real];
    out.classList.add("visible");
  });
}

function move(d){
  visual+=d;
  y-=d*ITEM;
  list.style.transition="transform 170ms cubic-bezier(.32,.72,.23,1)";
  list.style.transform=`translateY(${y}px)`;

  setTimeout(()=>{
    if(visual<=1 || visual>=7){
      visual=4;
      y=-(visual*ITEM)+CENTER;
      list.style.transition="none";
      list.style.transform=`translateY(${y}px)`;
      void list.offsetHeight;
      list.style.transition="transform 170ms cubic-bezier(.32,.72,.23,1)";
    }
    update();
  },170);
}

document.getElementById("arrow-up").onclick=()=>move(-1);
document.getElementById("arrow-down").onclick=()=>move(1);

let startY=0;
list.addEventListener("touchstart",e=>startY=e.touches[0].clientY);
list.addEventListener("touchend",e=>{
  const d=e.changedTouches[0].clientY-startY;
  if(d>40)move(-1);
  if(d<-40)move(1);
});

update();
</script>
</body>
</html>
