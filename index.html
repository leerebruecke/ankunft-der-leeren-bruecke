<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>leerebruecke</title>
 
  <style>
    :root {
      --bg-root: #1a1218;
      --text-main: #f5f0e8;
      --text-muted: #c6beb3;
    }
 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    html, body {
      height: 100%;
      background: var(--bg-root);
      color: var(--text-main);
      font-family: monospace;
      user-select: none;
    }
 
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .page-frame {
      position: relative;
      height: min(100vh,1200px);
      width: calc(min(100vh,1200px) * 9/16);
      max-width: 100vw;
      overflow: hidden;
    }
 
    .page-background {
      position: absolute;
      inset: 0;
      background-image: url("Grafiken/Br%C3%BCcke.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      opacity: 1;
      pointer-events: none;
    }
 
    .page-content {
      position: absolute;
      inset: 0;
      padding: 2rem 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
 
    .logo-img {
      max-width: 90%;
      height: auto;
      image-rendering: pixelated;
    }
 
    .menu-wrapper {
      margin-top: 0.8rem;
      pointer-events: auto;
    }
 
    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }
 
    .menu-button {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 300ms ease-out, transform 300ms ease-out;
    }
 
    .menu-button.visible {
      opacity: 1;
      transform: translateY(0);
    }
 
    .current-label, .back-link {
      margin-top: 0.3rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 300ms ease-out, transform 300ms ease-out;
    }
 
    .current-label.visible,
    .back-link.visible {
      opacity: 1;
      transform: translateY(0);
    }
 
    .back-link { cursor: pointer; }
 
    .sections {
      margin-top: 1.2rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: center;
    }
 
    .section {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 300ms ease-out, transform 300ms ease-out;
      font-size: 0.82rem;
      line-height: 1.35;
    }
 
    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }
 
  </style>
</head>
<body>
  <div class="page-frame" id="page-frame">
    <div class="page-background"></div>
 
    <div class="page-content">
      <img src="Grafiken/leerebruecke.png" class="logo-img" draggable="false" />
 
      <div class="menu-wrapper" id="menu-wrapper">
        <ul class="menu-list" id="menu-list">
          <li><button class="menu-button" data-section="musik">Musik</button></li>
          <li><button class="menu-button" data-section="gemaelde">Gemälde</button></li>
          <li><button class="menu-button" data-section="unterstuetzung">Unterstützung</button></li>
        </ul>
      </div>
 
      <div class="current-label" id="current-label"></div>
      <div class="back-link" id="back-link">Zurück</div>
 
      <div class="sections" id="sections">
        <div class="section" id="section-musik">Musik‑Bereich</div>
        <div class="section" id="section-gemaelde">Gemälde‑Bereich</div>
        <div class="section" id="section-unterstuetzung">Unterstützung‑Bereich</div>
      </div>
    </div>
  </div>
 
  <script>
    const menuButtons = [...document.querySelectorAll('.menu-button')];
    const currentLabel = document.getElementById('current-label');
    const backLink = document.getElementById('back-link');
    const sections = {
      musik: document.getElementById('section-musik'),
      gemaelde: document.getElementById('section-gemaelde'),
      unterstuetzung: document.getElementById('section-unterstuetzung')
    };
 
    window.addEventListener('load', () => {
      menuButtons.forEach((btn, i) => {
        setTimeout(() => btn.classList.add('visible'), 350 + i * 180);
      });
    });
 
    function openSection(key, label) {
      currentLabel.textContent = label;
      currentLabel.classList.add('visible');
      backLink.classList.add('visible');
 
      Object.entries(sections).forEach(([k, sec]) => {
        if (k === key) sec.classList.add('visible');
        else sec.classList.remove('visible');
      });
 
      menuButtons.forEach(btn => btn.classList.remove('visible'));
    }
 
    function closeSection() {
      currentLabel.classList.remove('visible');
      backLink.classList.remove('visible');
 
      Object.values(sections).forEach(sec => sec.classList.remove('visible'));
 
      menuButtons.forEach((btn, i) => {
        setTimeout(() => btn.classList.add('visible'), 200 + i * 160);
      });
    }
 
    menuButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        openSection(btn.dataset.section, btn.textContent.trim());
      });
    });
 
    backLink.addEventListener('click', closeSection);
 
    document.addEventListener('contextmenu', e => {
      if (e.target.closest('#page-frame')) e.preventDefault();
    });
  </script>
</body>
</html>
