<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root{
  --bg-root:#1a1218;
  --text-main:#f5f0e8;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--bg-root);
  color:var(--text-main);
  font-family:'Lucida Console',monospace;
  user-select:none;
  overflow:hidden;
}

body{display:flex;align-items:center;justify-content:center;}

/* FRAME */
.page-frame{
  position:relative;
  --base:min(100vh,1200px);
  height:calc(var(--base)*1.20);
  width:calc(var(--base)*1.20*9/16);
  overflow:hidden;
}

.page-background{
  position:absolute;
  inset:0;
  background-image:url("Grafiken/Br%C3%BCcke.png");
  background-size:100% 100%;
  background-repeat:no-repeat;
  image-rendering:pixelated;
}

/* CONTENT */
.page-content{
  position:absolute;
  inset:0;
  padding:1.1rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.logo-img{
  width:70%;
  margin-top:0.2rem;
  margin-bottom:1rem;
  image-rendering:pixelated;
}

@media (max-width:768px){
  .logo-img{margin-top:10%;}
}

/* ----------------------------- SLOT ----------------------------- */

/* Whole roll module ~40px higher */
.slot-group{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  transform:translateY(-40px);
}

/* Window: keep your proven height, but make width robust */
.slot-window{
  position:relative;
  width:clamp(220px,55%,520px);
  height:65px;
  overflow:hidden;
  flex-shrink:0;

  mask-image:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
}

/* List */
.slot-list{
  position:absolute;
  left:50%;
  transform:translateX(-50%) translateY(0);
  display:flex;
  flex-direction:column;
  align-items:center;
  will-change:transform;
}

/* Items */
.slot-item{
  height:42px;
  font-size:0.86rem;
  letter-spacing:0.1em;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.20;
  transform:scale(0.85);
  transition:opacity 150ms, transform 150ms;
  white-space:nowrap;
}

.slot-item.active{
  opacity:1;
  transform:scale(1.05);
}

/* Arrows */
.arrow{
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  opacity:0.75;
  cursor:pointer;
  transition:opacity 200ms;
  flex-shrink:0;
}

.arrow:hover{opacity:1;}

.arrow-up{
  border-bottom:14px solid var(--text-main);
  margin-bottom:4px;
}

.arrow-down{
  border-top:14px solid var(--text-main);
  margin-top:4px;
}

/* Text */
.section-area{
  margin-top:1.2rem;
  font-size:0.86rem;
  opacity:0;
  transition:opacity 260ms ease-out;
}

.section-area.visible{
  opacity:1;
}
</style>
</head>

<body>

<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">

    <img src="Grafiken/leerebruecke.png" class="logo-img"/>

    <div class="slot-group">

      <div class="arrow arrow-up" id="arrow-up"></div>

      <div class="slot-window">
        <div class="slot-list" id="slot-list">
          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>
        </div>
      </div>

      <div class="arrow arrow-down" id="arrow-down"></div>

    </div>

    <div class="section-area" id="section-area"></div>

  </div>
</div>

<script>
/* DATA */
const texts = {
  Musik: "Dies ist ein Testtext für Musik.",
  Gemälde: "Dies ist ein Testtext für Gemälde.",
  Unterstützung: "Dies ist ein Testtext für Unterstützung."
};

/* ELEMENTS */
const list = document.getElementById("slot-list");
const out = document.getElementById("section-area");
const arrowUp = document.getElementById("arrow-up");
const arrowDown = document.getElementById("arrow-down");
const slotWindow = document.querySelector(".slot-window");
const swipeSurface = document.querySelector(".page-frame"); 
/* whole display target; you can change to ".page-content" if you prefer */

/* GEOMETRY */
const ITEM_HEIGHT = 42;
const WINDOW_HEIGHT = 65;
const CENTER_OFFSET = (WINDOW_HEIGHT - ITEM_HEIGHT) / 2;

/* Centered item is always the SECOND child */
const BASE_Y = -(1 * ITEM_HEIGHT) + CENTER_OFFSET;

/* TIMING */
const ANIM_MS = 170;
const LOCK_MS = 400;

/* STATE */
let busy = false;
let lockUntil = 0;

/* INIT POSITION */
list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

/* LOCK HELPERS */
function isLocked() {
  return busy || Date.now() < lockUntil;
}
function lockInput() {
  lockUntil = Date.now() + LOCK_MS;
}

/* ACTIVE + TEXT */
function updateActive() {
  const nodes = Array.from(list.children);
  nodes.forEach(n => n.classList.remove("active"));

  const centerNode = nodes[1];
  if (centerNode) centerNode.classList.add("active");

  const key = centerNode ? centerNode.textContent.trim() : "";

  out.classList.remove("visible");
  setTimeout(() => {
    out.textContent = texts[key] ?? "";
    out.classList.add("visible");
  }, 80);
}

/* MOVE DOWN */
function moveDown() {
  if (isLocked()) return;
  busy = true;
  lockInput();

  list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;

  const onEnd = () => {
    list.removeEventListener("transitionend", onEnd);

    const first = list.firstElementChild;
    if (first) list.appendChild(first);

    list.style.transition = "none";
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    requestAnimationFrame(() => {
      updateActive();
      busy = false;
    });
  };

  list.addEventListener("transitionend", onEnd, { once: true });
}

/* MOVE UP */
function moveUp() {
  if (isLocked()) return;
  busy = true;
  lockInput();

  const last = list.lastElementChild;
  if (last) list.insertBefore(last, list.firstElementChild);

  list.style.transition = "none";
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;

  requestAnimationFrame(() => {
    list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    const onEnd = () => {
      list.removeEventListener("transitionend", onEnd);
      updateActive();
      busy = false;
    };

    list.addEventListener("transitionend", onEnd, { once: true });
  });
}

/* CLICK */
arrowUp.onclick = moveUp;
arrowDown.onclick = moveDown;

/* TOUCH on LIST (kept) */
let startYList = 0;

list.addEventListener("touchstart", e => {
  startYList = e.touches[0].clientY;
}, { passive: true });

list.addEventListener("touchend", e => {
  if (isLocked()) return;
  const diff = e.changedTouches[0].clientY - startYList;
  if (diff > 40) moveUp();
  if (diff < -40) moveDown();
}, { passive: true });

/* FULL-SCREEN SWIPE */
let startYScreen = 0;
let startXScreen = 0;

swipeSurface.addEventListener("touchstart", e => {
  const t = e.touches[0];
  startYScreen = t.clientY;
  startXScreen = t.clientX;
}, { passive: true });

swipeSurface.addEventListener("touchend", e => {
  if (isLocked()) return;

  const t = e.changedTouches[0];
  const dy = t.clientY - startYScreen;
  const dx = t.clientX - startXScreen;

  /* ignore mostly horizontal swipes */
  if (Math.abs(dx) > Math.abs(dy)) return;

  if (dy > 50) moveUp();
  if (dy < -50) moveDown();
}, { passive: true });

/* WHEEL (mouse + trackpad) */
let wheelAcc = 0;
const WHEEL_THRESHOLD = 30;

slotWindow.addEventListener("wheel", e => {
  /* crucial for preventing page scroll */
  e.preventDefault();
  if (isLocked()) return;

  wheelAcc += e.deltaY;

  if (Math.abs(wheelAcc) >= WHEEL_THRESHOLD) {
    const dir = wheelAcc > 0 ? 1 : -1;
    wheelAcc = 0;
    if (dir > 0) moveDown();
    else moveUp();
  }
}, { passive: false });

/* INIT */
updateActive();
</script>

</body>
</html>
