<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root{
  --bg-root:#1a1218;
  --text-main:#f5f0e8;

  /* geometry */
  --item-h: 42px;
  --window-h: 65px;

  /* sizes */
  --arrow-size: 14px;
  --slot-font: 0.86rem;
  --text-font: 0.86rem;

  /* positioning */
  --roll-lift: -40px;

  /* slot width */
  --slot-w-min: 220px;
  --slot-w-pref: 55%;
  --slot-w-max: 520px;

  /* typewriter */
  --type-speed-ms: 28;  /* slower (previously 14) */
  --fade-out-ms: 120;

  /* icons */
  --icon-size: 70px;      /* ~2.5x */
  --icon-fade-ms: 520ms;  /* slower/softer reveal */
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--bg-root);
  color:var(--text-main);
  font-family:'Lucida Console',monospace;
  user-select:none;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* FRAME */
.page-frame{
  position:relative;
  --base:min(100svh,1200px);
  height:calc(var(--base)*1.20);
  width:calc(var(--base)*1.20*9/16);
  overflow:hidden;
}

.page-background{
  position:absolute;
  inset:0;
  background-image:url("Grafiken/Br%C3%BCcke.png");
  background-repeat:no-repeat;
  background-position:center center;
  background-size:100% 100%;
  image-rendering:pixelated;
}

/* CONTENT */
.page-content{
  position:absolute;
  inset:0;
  padding:1.1rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.logo-img{
  width:70%;
  margin-top:0.2rem;
  margin-bottom:1rem;
  image-rendering:pixelated;
}

/* ----------------------------- SLOT ----------------------------- */

.slot-group{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  transform:translateY(var(--roll-lift));
}

.slot-window{
  position:relative;
  width:clamp(var(--slot-w-min), var(--slot-w-pref), var(--slot-w-max));
  height:var(--window-h);
  overflow:hidden;
  flex-shrink:0;

  mask-image:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
}

.slot-list{
  position:absolute;
  left:50%;
  transform:translateX(-50%) translateY(0);
  display:flex;
  flex-direction:column;
  align-items:center;
  will-change:transform;
}

.slot-item{
  height:var(--item-h);
  font-size:var(--slot-font);
  letter-spacing:0.1em;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.20;
  transform:scale(0.85);
  transition:opacity 150ms, transform 150ms;
  white-space:nowrap;
}

.slot-item.active{
  opacity:1;
  transform:scale(1.05);
}

.arrow{
  width:0;height:0;
  border-left:var(--arrow-size) solid transparent;
  border-right:var(--arrow-size) solid transparent;
  opacity:0.75;
  cursor:pointer;
  transition:opacity 200ms;
  flex-shrink:0;
}

.arrow:hover{opacity:1;}

.arrow-up{
  border-bottom:var(--arrow-size) solid var(--text-main);
  margin-bottom:4px;
}

.arrow-down{
  border-top:var(--arrow-size) solid var(--text-main);
  margin-top:4px;
}

/* ----------------------------- SECTION AREA ----------------------------- */

.section-area{
  margin-top:1.2rem;
  font-size:var(--text-font);
  opacity:1;
  transition:opacity 260ms ease-out;

  /* vorher: width:min(85%, 36rem); */
  width:min(72%, 30rem);

  text-align:left;
  margin-left:auto;
  margin-right:auto;
}

.section-area.fading{
  opacity:0;
  transition:opacity var(--fade-out-ms) ease-out;
}

/* Title under the slot intentionally disabled */
.section-title{ display:none; }

.section-body{
  line-height:1.45;
  opacity:0.92;
  padding:0 0.1rem;
}

/* Typed segments */
.seg{
  display:block;
  margin:0;
  padding:0;
}

.seg-normal{
  opacity:0.92;
}

.seg-italic{
  font-style:italic;
  opacity:0.78;
}

.seg-aside{
  font-style:italic;
  opacity:0.55;
}

/* Attribution line */
.seg-attrib{
  font-style:italic;
  opacity:0.20;
  margin-top:0.25rem;
  text-align:left;
}

/* Icons */
.icon-row{
  margin-top:0.9rem;
  display:flex;
  gap:1rem;
  justify-content:flex-start;
  align-items:center;
  flex-wrap:wrap;

  opacity:0;
  transform:translateY(2px);
  transition:
    opacity var(--icon-fade-ms) ease-out,
    transform var(--icon-fade-ms) ease-out;
}

.icon-row.visible{
  opacity:1;
  transform:translateY(0);
}

.icon-row a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.icon-row img{
  width:var(--icon-size);
  height:var(--icon-size);
  object-fit:contain;
  image-rendering:auto;
  opacity:0.92;
}

/* ----------------------------- MOBILE TUNING ----------------------------- */

@media (max-width: 768px){
  :root{
    --arrow-size: 10px;
    --slot-font: 0.74rem;
    --text-font: 0.74rem;

    --slot-w-min: 170px;
    --slot-w-max: 360px;

    --icon-size: 56px;
    --icon-fade-ms: 520ms;
  }

  .logo-img{
    width:62%;
    margin-top:8%;
    margin-bottom:0.8rem;
  }

  .slot-group{
    transform:translateY(var(--roll-lift)) scale(0.82);
  }

  .section-area{
    margin-top:0.9rem;
  }

  .page-background{
    background-size:contain;
  }

  .arrow-up{ margin-bottom:0px; }
  .arrow-down{ margin-top:0px; }

  .arrow{ pointer-events:none; }
}

@media (max-width: 420px){
  .slot-group{
    transform:translateY(var(--roll-lift)) scale(0.78);
  }
}
</style>
</head>

<body>

<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">

    <img src="Grafiken/leerebruecke.png" class="logo-img"/>

    <div class="slot-group">

      <div class="arrow arrow-up" id="arrow-up"></div>

      <div class="slot-window">
        <div class="slot-list" id="slot-list"></div>
      </div>

      <div class="arrow arrow-down" id="arrow-down"></div>

    </div>

    <div class="section-area" id="section-area">
      <div class="section-title" id="section-title"></div>
      <div class="section-body" id="section-body"></div>
      <div class="section-extras" id="section-extras"></div>
    </div>

  </div>
</div>

<script>
const PAGES = [
  { id:"prelude-1", label:"…", text:"Du ziehst vorbei an einer einigenden Kraft." },
  { id:"prelude-2", label:"…", text:"Du spürst den Geist, aus dem alles stammt." },
  { id:"prelude-3", label:"…", text:"Du spürst, wie Raum dich umgibt." },

  { id:"leere", label:"Es bleibt Leere", text:"…" },
  { id:"keine-worte", label:"Es bleiben keine Worte mehr", text:"…" },
  { id:"kein-weg", label:"Es bleibt kein Weg mehr", text:"…" },
  { id:"nichts-zu-sehen", label:"Hier gibt es nichts mehr zu sehen", text:"…" },

  { id:"ellipsis-a", label:"…", text:"…" },
  { id:"ellipsis-b", label:"…", text:"…" },

  {
    id:"hohl",
    label:"Du bist ziemlich hohl, oder?",
    text:
`Die, die für den Seitenabschnitt zuständig sind, haben bereits alles gesagt…
Flüsternd: Zum Glück muss ich es nicht mehr tun.`
  },

  {
    id:"no-up",
    label:"Man kann nicht einfach so nach oben gehen",
    text:"Du musst in die andere Richtung. So funktioniert das Spiel eben, frag mich nicht."
  },

  {
    id:"wrong-here",
    label:"Hier bist du wohl falsch",
    text:"Das davor habe ich ernst gemeint."
  },

  {
    id:"why-here",
    label:"Warum bist du noch hier?",
    text:
`Es scheint, als wärst du weiter in die falsche Richtung gelaufen.
Hier gibt es nichts für dich.`
  },

  {
    id:"wrong-dir",
    label:"Falsche Richtung",
    text:"Hier lang geht es nicht! Auf, auf und davon!"
  },

  { id:"ellipsis-c", label:"…", text:"…" },
  { id:"ellipsis-d", label:"…", text:"…" },

  { id:"ueber", label:"Über", text:"Über dir die Unendlichkeit." },

  {
    id:"klang",
    label:"Klang",
    text:
`Ein Stück des Teils, der immer war,
Dunkelheit, die Licht gebar,
das stolze Licht, das nachts erlischt,
und Schein bleibt, solange Winter ist.`,
    attrib:"Goethe (abgewandelt)",
    icons:[
      { file:"Spotify.png" },
      { file:"Apple_Music.png" },
      { file:"YouTube_Music.png" }
    ]
  },

  {
    id:"spenden",
    label:"Spendenbox",
    text:"Geben ist ein Selbstverlust, aber kein Verlust an sich.",
    attrib:"Kafka",
    aside:"*hust* Wir brauchen Geld für den Umsturz deutscher Kunst. *hust*",
    icons:[
      { file:"PayPal.png" },
      { file:"Patreon.png" }
    ]
  },

  {
    id:"skizzen",
    label:"Skizzen",
    text:
`„Ich glaube, man könnte die Skizzen verkaufen,
sie zeigen die Arbeit in ihrem Anfang.“`,
    attrib:"Vincent",
    aside:"100 € für eine Skizze der Leerebrücke? Menschen aus der Zukunft würden sich am Arm zwicken und eine kaufen."
  },

  {
    id:"erscheinungsorte",
    label:"Erscheinungsorte",
    text:
`Alles, was tief ist, liebt Masken; Bild und Erscheinung hasst es jedoch.
Es bleibt der Tiefe Bürde,
wie das, was im Grunde widerstrebend ist, dennoch kundgeben und mitteilen kann.“`,
    attrib:"Nietzsche (abgewandelt)",
    icons:[
      { file:"TikTok.png" },
      { file:"Instagram.png" },
      { file:"YouTube.png" },
      { file:"Twitch.png" }
    ]
  },

  {
    id:"museum",
    label:"Museum",
    italicAll:true,
    text:
`Keiner öffnet die Tür.
Es scheint, als wäre das Museum noch geschlossen.
Die Spendenbox scheint jedoch einwandfrei zu funktionieren.`
  },

  {
    id:"kontakt",
    label:"Kontaktschleuse",
    text:
`Wer mit Ungeheuern kämpft, mag zusehen,
daß er nicht dabei zum Ungeheuer wird.
Und wenn du lange in einen Abgrund blickst,
blickt der Abgrund auch in dich hinein.`,
    attrib:"Nietzsche",
    plainTail:"Kuumitori@gmail.com"
  },

  { id:"unter", label:"Unter", text:"Unter dir der Grund." },
  { id:"orden", label:"Leerebrücke", text:"Ein mythopoietischer Orden." }
];

const list = document.getElementById("slot-list");
const out = document.getElementById("section-area");
const titleEl = document.getElementById("section-title");
const bodyEl = document.getElementById("section-body");
const extrasEl = document.getElementById("section-extras");
const arrowUp = document.getElementById("arrow-up");
const arrowDown = document.getElementById("arrow-down");
const frame = document.querySelector(".page-frame");

const ITEM_HEIGHT = 42;
const WINDOW_HEIGHT = 65;
const CENTER_OFFSET = (WINDOW_HEIGHT - ITEM_HEIGHT) / 2;
const BASE_Y = -(1 * ITEM_HEIGHT) + CENTER_OFFSET;

const ANIM_MS = 170;

let busy = false;
let wheelAcc = 0;
const WHEEL_THRESHOLD = 30;
const WHEEL_CLAMP = 120;

let typingTimer = null;
let typingToken = 0;

let failTimer = null;
function setBusy(){
  busy = true;
  clearTimeout(failTimer);
  failTimer = setTimeout(() => {
    busy = false;
    wheelAcc = 0;
  }, ANIM_MS + 140);
}
function clearBusy(){
  clearTimeout(failTimer);
  busy = false;
}

function escapeHTML(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function buildSlotItems(){
  list.innerHTML = "";
  PAGES.forEach(p => {
    const div = document.createElement("div");
    div.className = "slot-item";
    div.textContent = p.label;
    div.dataset.pageId = p.id;
    list.appendChild(div);
  });
}

function primeStart(){
  let safety = 0;
  while (list.children[1] && list.children[1].dataset.pageId !== "klang" && safety < 500){
    const last = list.lastElementChild;
    if (last) list.insertBefore(last, list.firstElementChild);
    safety++;
  }
}

function resolvePageById(id){
  return PAGES.find(p => p.id === id) || { id, label:"", text:"" };
}

function clearTyping(){
  typingToken++;
  if (typingTimer){
    clearInterval(typingTimer);
    typingTimer = null;
  }
}

function buildSegments(page){
  const segs = [];

  const mainClass = page.italicAll ? "seg-italic" : "seg-normal";
  if (page.text){
    segs.push({ cls: mainClass, text: page.text, preBlank: 0 });
  }

  if (page.attrib){
    segs.push({
      cls: "seg-attrib",
      text: `— ${page.attrib}`,
      preBlank: 0
    });
  }

  if (page.aside){
    segs.push({
      cls: "seg-aside",
      text: page.aside,
      preBlank: 1
    });
  }

  if (page.plainTail){
    segs.push({
      cls: "seg-normal",
      text: page.plainTail,
      preBlank: 1
    });
  }

  return segs;
}

function renderSegmentsHTML(segs, upToSeg, partialText){
  let html = "";

  for (let i = 0; i < segs.length; i++){
    const s = segs[i];
    const blanks = s.preBlank ? "<br>".repeat(s.preBlank) : "";

    if (i < upToSeg){
      const content = escapeHTML(s.text).replace(/\n/g,"<br>");
      html += `${blanks}<div class="seg ${s.cls}">${content}</div>`;
    } else if (i === upToSeg){
      const content = escapeHTML(partialText).replace(/\n/g,"<br>");
      html += `${blanks}<div class="seg ${s.cls}">${content}</div>`;
    }
  }

  return html;
}

function renderIcons(page){
  extrasEl.innerHTML = "";
  if (!page.icons || !Array.isArray(page.icons) || page.icons.length === 0) return;

  const row = document.createElement("div");
  row.className = "icon-row";

  page.icons.forEach(ic => {
    const file = ic.file;
    const href = ic.href;

    const img = document.createElement("img");
    img.src = `Grafiken/${file}`;
    img.alt = file.replace(".png","");

    if (href){
      const a = document.createElement("a");
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(img);
      row.appendChild(a);
    } else {
      row.appendChild(img);
    }
  });

  extrasEl.appendChild(row);

  requestAnimationFrame(() => {
    row.classList.add("visible");
  });
}

function typePage(page){
  clearTyping();
  titleEl.textContent = "";

  const segs = buildSegments(page);
  bodyEl.innerHTML = "";
  extrasEl.innerHTML = "";

  if (segs.length === 0){
    renderIcons(page);
    return;
  }

  const speed = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--type-speed-ms")) || 28;

  let segIndex = 0;
  let charIndex = 0;
  const token = ++typingToken;

  const currentText = () => segs[segIndex]?.text ?? "";

  typingTimer = setInterval(() => {
    if (token !== typingToken){
      clearInterval(typingTimer);
      typingTimer = null;
      return;
    }

    const full = currentText();
    charIndex++;

    const partial = full.slice(0, charIndex);
    bodyEl.innerHTML = renderSegmentsHTML(segs, segIndex, partial);

    if (charIndex >= full.length){
      segIndex++;
      charIndex = 0;

      if (segIndex >= segs.length){
        clearInterval(typingTimer);
        typingTimer = null;
        renderIcons(page);
      }
    }
  }, speed);
}

function showPage(page){
  out.classList.add("fading");
  clearTyping();

  const fadeMs = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fade-out-ms")) || 120;

  setTimeout(() => {
    out.classList.remove("fading");
    typePage(page);
  }, fadeMs);
}

function updateActive(){
  const nodes = Array.from(list.children);
  nodes.forEach(n => n.classList.remove("active"));

  const center = list.children[1];
  if (center) center.classList.add("active");

  const pageId = center?.dataset.pageId || "";
  const page = resolvePageById(pageId);

  showPage(page);
}

list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

function moveDown(){
  if (busy) return;
  setBusy();

  const onEnd = () => {
    list.removeEventListener("transitionend", onEnd);
    list.removeEventListener("transitioncancel", onEnd);

    const first = list.firstElementChild;
    if (first) list.appendChild(first);

    list.style.transition = "none";
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    requestAnimationFrame(() => {
      updateActive();
      clearBusy();
    });
  };

  list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;

  list.addEventListener("transitionend", onEnd, { once:true });
  list.addEventListener("transitioncancel", onEnd, { once:true });
}

function moveUp(){
  if (busy) return;
  setBusy();

  const last = list.lastElementChild;
  if (last) list.insertBefore(last, list.firstElementChild);

  list.style.transition = "none";
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;

  void list.offsetHeight;

  requestAnimationFrame(() => {
    const onEnd = () => {
      list.removeEventListener("transitionend", onEnd);
      list.removeEventListener("transitioncancel", onEnd);

      updateActive();
      clearBusy();
    };

    list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    list.addEventListener("transitionend", onEnd, { once:true });
    list.addEventListener("transitioncancel", onEnd, { once:true });
  });
}

function applyInputMode(){
  const isMobile = window.matchMedia("(max-width: 768px)").matches;

  if (isMobile){
    arrowUp.onclick = null;
    arrowDown.onclick = null;
  } else {
    arrowUp.onclick = moveUp;
    arrowDown.onclick = moveDown;
  }
}

applyInputMode();
window.addEventListener("resize", applyInputMode);

let startY = 0;
let startX = 0;

frame.addEventListener("touchstart", e => {
  const t = e.touches[0];
  startY = t.clientY;
  startX = t.clientX;
}, { passive:true });

frame.addEventListener("touchend", e => {
  if (busy) return;

  const t = e.changedTouches[0];
  const dy = t.clientY - startY;
  const dx = t.clientX - startX;

  if (Math.abs(dx) > Math.abs(dy)) return;

  if (dy > 50) moveUp();
  if (dy < -50) moveDown();
}, { passive:true });

frame.addEventListener("wheel", e => {
  e.preventDefault();
  if (busy) { wheelAcc = 0; return; }

  wheelAcc += e.deltaY;
  if (wheelAcc > WHEEL_CLAMP) wheelAcc = WHEEL_CLAMP;
  if (wheelAcc < -WHEEL_CLAMP) wheelAcc = -WHEEL_CLAMP;

  if (Math.abs(wheelAcc) >= WHEEL_THRESHOLD){
    const dir = wheelAcc > 0 ? 1 : -1;
    wheelAcc = 0;
    if (dir > 0) moveDown();
    else moveUp();
  }
}, { passive:false });

buildSlotItems();
primeStart();
updateActive();
</script>

</body>
</html>
