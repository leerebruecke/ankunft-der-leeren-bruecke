<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leerebruecke</title>

<style>
/* Grundfarben und Schrift */
:root {
  --bg-light: #eae7df;
  --text-light: #1a1812;
  --bg-dark: #1a1812;
  --text-dark: #d4d1c9; /* milderes Weiß */
}

body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  background-color: var(--bg-light);
  color: var(--text-light);
  transition: background-color 0.5s, color 0.5s;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Nachtmodus */
body.dark {
  background-color: var(--bg-dark);
  color: var(--text-dark);
}

/* Logo */
header {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  padding: 20px 40px;
}
header img {
  width: 220px;
  max-width: 40%;
}

/* Menü */
nav {
  text-align: center;
  margin-bottom: 40px;
}
nav ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: inline-block;
  text-align: left;
}
nav ul li {
  margin: 8px 0;
}
nav ul li a {
  text-decoration: none;
  color: inherit;
  font-size: 1.1em;
  transition: color 0.2s ease;
}
nav ul li a:hover {
  color: rgba(0,0,0,0.5); /* zarte visuelle Veränderung statt Unterstrich */
}
body.dark nav ul li a:hover {
  color: rgba(255,255,255,0.6);
}

/* Schriftstücke Unterpunkte */
.submenu {
  display: none;
  animation: fadeIn 0.4s ease;
}
nav ul li.show .submenu {
  display: block;
}
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(-3px);}
  to {opacity: 1; transform: translateY(0);}
}

/* Hauptinhalt */
main {
  flex: 1;
  padding: 0 20px;
  max-width: 750px;
  margin: 0 auto;
}

/* Footer */
footer {
  text-align: center;
  font-size: 0.8em;
  padding: 15px 10px;
  position: relative;
  bottom: 0;
  margin-top: auto;
}
footer p {
  line-height: 1.6;
  margin: 0;
}

/* Tag-/Nachtmodus-Schalter */
#modeToggle {
  position: fixed;
  top: 10px;
  right: 15px;
  background: none;
  border: none;
  color: inherit;
  font-size: 0.8em;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.3s;
}
#modeToggle:hover {
  opacity: 1;
}
</style>
</head>
<body>
<button id="modeToggle">Nachtmodus</button>

<header>
  <img src="bilder/titel_s.png" alt="leerebruecke Logo">
</header>

<nav>
  <ul>
    <li><a href="#">Klangwerke</a></li>
    <li id="schriftstuecke">
      <a href="#">Schriftstücke</a>
      <ul class="submenu">
        <li><a href="#" onclick="openText('Der Junge mit der Maske')">Der Junge mit der Maske</a></li>
        <li><a href="#" onclick="openText('Socken')">Socken</a></li>
      </ul>
    </li>
    <li><a href="#">Gemälde</a></li>
    <li><a href="#">Geisterjäger</a></li>
    <li><a href="#">Unterstützung</a></li>
  </ul>
</nav>

<main id="content"></main>

<footer>
  <p>© leerebruecke<br>Über • Unter<br>Eine schöpfende Ordensgemeinschaft der Leere</p>
</footer>

<script>
const texts = {
  "Der Junge mit der Maske": `
  <h2>Der Junge mit der Maske</h2>
  <p>Er sitzt an der Kirchenmauer und betrachtet Insekten.
  Wie sie sich in nahegelegenes Unkraut stürzen, Gesteinsbrocken erklimmen und nach Liebe suchen.</p>
  <p>Seine Maske, Zeugin verschluckender Dunkelheit — lächelt breit und hemmungslos.
  Die Augen krankhaft aufgequollen.</p>
  <p>Und doch sitzt er da, an seiner Mauer und betrachtet mit einer ausserweltlichen Zärtlichkeit Insekten.
  Wie sie sich in nahegelegenes Unkraut stürzen, Gesteinsbrocken erklimmen und nach Liebe suchen.</p>
  <a href="#" onclick="goBack()">← zurück</a>`,

  "Socken": `
  <h2>Socken</h2>
  <p>Heute verdiene ich keine sauberen Socken.
  Nein, heute verdiene ich keine sauberen Socken.</p>
  <p>Gestern habe ich sie vielleicht noch verdient aber nicht heute.
  Es kann sein, dass ich sie wann anders verdient hätte aber heute nicht, heute bin ich nicht würdevoll genug.</p>
  <em>Und so zog er sich dreckige Socken an und verbrachte den Tag.</em>
  <a href="#" onclick="goBack()">← zurück</a>`
};

function openText(title) {
  document.querySelector("nav").style.display = "none";
  document.getElementById("content").innerHTML = texts[title];
}
function goBack() {
  document.querySelector("nav").style.display = "block";
  document.getElementById("content").innerHTML = "";
}

document.getElementById("schriftstuecke").addEventListener("click", function() {
  this.classList.toggle("show");
});

const modeButton = document.getElementById("modeToggle");
modeButton.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  modeButton.textContent = document.body.classList.contains("dark") ? "Tagmodus" : "Nachtmodus";
});
</script>

</body>
</html>
