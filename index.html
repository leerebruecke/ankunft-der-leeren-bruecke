<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>leerebruecke</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IBM+Plex+Mono:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #0a0a09;
      --ember: #dcd1b4;
      --dust: #b3a57b;
      --shadow: #1a1814;
      --pulse: #241f1b;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 40%, var(--shadow) 0%, var(--void) 80%);
      color: var(--ember);
      font-family: 'IBM Plex Mono', monospace;
      overflow-x: hidden;
      min-height: 100vh;
      letter-spacing: 0.03em;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('Grafiken/leerebruecke.png') center/20% no-repeat;
      opacity: 0.03;
      filter: blur(2px);
      pointer-events: none;
      animation: drift 60s infinite linear;
    }

    @keyframes drift {
      0% { background-position: 50% 40%; }
      50% { background-position: 48% 43%; }
      100% { background-position: 50% 40%; }
    }

    header {
      text-align: center;
      padding-top: 4rem;
      font-family: 'UnifrakturCook', cursive;
      font-size: clamp(3rem, 6vw, 6rem);
      color: var(--ember);
      text-shadow: 0 0 15px var(--pulse), 0 0 30px var(--shadow);
      transform: rotate(-0.5deg);
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
      border-top: 1px solid var(--dust);
      border-bottom: 1px solid var(--dust);
      padding: 1rem 0;
      text-transform: lowercase;
      font-size: 1rem;
    }

    nav a {
      color: var(--ember);
      text-decoration: none;
      transition: all 0.4s ease;
    }

    nav a:hover {
      color: var(--dust);
      letter-spacing: 0.08em;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 4rem;
      padding: 0 2rem;
    }

    h2 {
      font-family: 'UnifrakturCook', cursive;
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--dust);
    }

    p {
      max-width: 700px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--ember);
    }

    .sigil {
      margin-top: 3rem;
      width: 120px;
      height: 120px;
      border: 1px solid var(--dust);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: breathe 8s infinite ease-in-out;
    }

    .sigil::before {
      content: '';
      position: absolute;
      width: 60%;
      height: 60%;
      border: 1px dashed var(--dust);
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.8rem;
      color: var(--dust);
      border-top: 1px solid var(--pulse);
      margin-top: 4rem;
    }
  </style>
</head>
<body>
  <header>leerebruecke</header>

  <nav>
    <a href="#klangwerke">klangwerke</a>
    <a href="#schriftstuecke">schriftstücke</a>
    <a href="#gemaelde">gemälde</a>
    <a href="#orden">orden</a>
    <a href="#unter">unter</a>
  </nav>

  <main>
    <h2>eine schöpfende ordensgemeinschaft der leere</h2>
    <p>inmitten der ruinen von bedeutung, webt der geist neue brücken aus klang, asche und erinnerung. was vergeht, formt, was bleibt.</p>
    <div class="sigil"><span>∞</span></div>
  </main>

  <footer>
    © leerebruecke — über | unter
  </footer>
</body>
</html>
