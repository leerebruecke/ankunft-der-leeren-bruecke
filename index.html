<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root {
  --bg-root: #1a1218;
  --text-main: #f5f0e8;
}

/* RESET */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: var(--bg-root);
  color: var(--text-main);
  font-family: 'Lucida Console', monospace;
  user-select: none;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FRAME */

.page-frame {
  position: relative;
  --base: min(100vh, 1200px);
  height: calc(var(--base) * 1.20);
  width: calc(var(--base) * 1.20 * 9/16);
  overflow: hidden;
}

.page-background {
  position: absolute;
  inset: 0;
  background-image: url("Grafiken/Br%C3%BCcke.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

/* CONTENT */

.page-content {
  position: absolute;
  inset: 0;
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo-img {
  width: 70%;
  margin-top: 0.2rem;
  margin-bottom: 1rem;
  image-rendering: pixelated;
}

@media (max-width: 768px) {
  .logo-img { margin-top: 10%; }
}

/* ------------------------ VIEWPORT-SLOT ------------------------ */

.slot-window {
  position: relative;
  width: 55%;
  height: 85px; /* genug für Geister-Previews */
  overflow: hidden;

  mask-image: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.9) 15%,
    black 50%,
    rgba(0,0,0,0.9) 85%,
    transparent 100%
  );
}

/* LISTE (triple reel) */

.slot-list {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: top 180ms cubic-bezier(.32,.72,.23,1);
}

/* ITEMS */

.slot-item {
  height: 42px;
  font-size: 0.86rem;
  letter-spacing: 0.1em;
  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0.22;           /* Geister */
  transform: scale(0.85);  /* leichte Tiefenwirkung */
  transition: opacity 150ms, transform 150ms;
}

.slot-item.active {
  opacity: 1;
  transform: scale(1.05);
}

/* PFEILE */

.arrow {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  opacity: 0.75;
  cursor: pointer;
  transition: opacity 200ms;
}

.arrow:hover { opacity: 1; }

.arrow-up {
  border-bottom: 14px solid var(--text-main);
  margin-bottom: 4px;
}

.arrow-down {
  border-top: 14px solid var(--text-main);
  margin-top: 4px;
}

/* TEXT */

.section-area {
  margin-top: 1.2rem;
  font-size: 0.86rem;
  opacity: 0;
  transition: opacity 260ms ease-out;
}

.section-area.visible {
  opacity: 1;
}

</style>
</head>
<body>

<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">
    <img src="Grafiken/leerebruecke.png" class="logo-img" draggable="false"/>

    <div class="arrow arrow-up" id="arrow-up"></div>

    <!-- Slot-Fenster -->
    <div class="slot-window">
      <div class="slot-list" id="slot-list">
        <!-- TRIPLE-LIST (Endlosmechanik) -->
        <div class="slot-item">Musik</div>
        <div class="slot-item">Gemälde</div>
        <div class="slot-item">Unterstützung</div>

        <div class="slot-item">Musik</div>
        <div class="slot-item">Gemälde</div>
        <div class="slot-item">Unterstützung</div>

        <div class="slot-item">Musik</div>
        <div class="slot-item">Gemälde</div>
        <div class="slot-item">Unterstützung</div>
      </div>
    </div>

    <div class="arrow arrow-down" id="arrow-down"></div>

    <div class="section-area" id="section-area"></div>
  </div>
</div>

<script>
/* EINTRÄGE */

const baseItems = ["Musik", "Gemälde", "Unterstützung"];
const texts = {
  Musik: "Dies ist ein Testtext für Musik.",
  Gemälde: "Dies ist ein Testtext für Gemälde.",
  Unterstützung: "Dies ist ein Testtext für Unterstützung."
};

const list = document.getElementById("slot-list");
const items = [...document.querySelectorAll(".slot-item")];
const out = document.getElementById("section-area");

let index = 1;           // wir starten im mittleren Block
let visualIndex = 1;     // für die Sichtbarkeit
let topPos = -42 * 1;    // Anfangsposition im 2. Block

const ITEM_HEIGHT = 42;

/* Initialposition setzen */
list.style.top = topPos + "px";

/* UPDATE */

function update() {
  items.forEach(i => i.classList.remove("active"));
  items[visualIndex].classList.add("active");

  const real = baseItems[ (visualIndex % 3 + 3) % 3 ];

  out.classList.remove("visible");
  setTimeout(() => {
    out.textContent = texts[real];
    out.classList.add("visible");
  }, 100);
}

/* MOVE */

function moveDown() {
  topPos -= ITEM_HEIGHT;
  list.style.top = topPos + "px";

  visualIndex++;

  setTimeout(() => {
    if (visualIndex >= 6) {
      visualIndex = 3;
      topPos = -(ITEM_HEIGHT * 3);
      list.style.top = topPos + "px";
    }
    update();
  }, 180);
}

function moveUp() {
  topPos += ITEM_HEIGHT;
  list.style.top = topPos + "px";

  visualIndex--;

  setTimeout(() => {
    if (visualIndex < 3) {
      visualIndex = 5;
      topPos = -(ITEM_HEIGHT * 5);
      list.style.top = topPos + "px";
    }
    update();
  }, 180);
}

/* PFEILE */

document.getElementById("arrow-up").onclick = moveUp;
document.getElementById("arrow-down").onclick = moveDown;

/* MOBILE */

let startY = 0;

list.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
});

list.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].clientY - startY;
  if (diff > 40) moveUp();
  if (diff < -40) moveDown();
});

/* START */

update();
</script>

</body>
</html>
