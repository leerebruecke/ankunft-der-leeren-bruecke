<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root {
  --bg-root: #1a1812;
  --text-main: #f5f0e8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg-root);
  color: var(--text-main);
  font-family: 'Lucida Console', monospace;
  user-select: none;
  overflow: hidden;
}

body { display: flex; align-items: center; justify-content: center; }

.page-frame {
  position: relative;
  --base: min(100vh, 1200px);
  height: calc(var(--base) * 1.20);
  width: calc(var(--base) * 1.20 * 9/16);
  overflow: hidden;
}

.page-background {
  position: absolute;
  inset: 0;
  background-image: url("Grafiken/Br%C3%BCcke.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

.page-content {
  position: absolute;
  inset: 0;
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo-img {
  width: 70%;
  margin-top: 0.2rem;
  margin-bottom: 1rem;
  image-rendering: pixelated;
}

@media (max-width: 768px) {
  .logo-img { margin-top: 10%; }
}

/* ----------------------------- SLOT ----------------------------- */

/* KORREKT: 40px nach oben */
.slot-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  transform: translateY(-40px);
}

/* KORREKT: window exakt doppelte Höhe des Items */
.slot-window {
  position: relative;
  width: 55%;
  height: 84px; /* 2 * 42px → perfekte Mitte */
  overflow: hidden;

  mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
}

.slot-list {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 170ms cubic-bezier(.32,.72,.23,1);
}

.slot-item {
  height: 42px;
  font-size: 0.86rem;
  letter-spacing: 0.1em;
  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0.20;
  transform: scale(0.85);
  transition: opacity 150ms, transform 150ms;
}

.slot-item.active {
  opacity: 1;
  transform: scale(1.05);
}

.arrow {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  opacity: 0.75;
  cursor: pointer;
  transition: opacity 200ms;
}
.arrow:hover { opacity: 1; }

.arrow-up { border-bottom: 14px solid var(--text-main); margin-bottom: 4px; }
.arrow-down { border-top: 14px solid var(--text-main); margin-top: 4px; }

.section-area {
  margin-top: 2.6rem;
  font-size: 0.86rem;
  opacity: 0;
  transition: opacity 260ms ease-out;
}

.section-area.visible { opacity: 1; }
</style>
</head>
<body>

<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">

    <img src="Grafiken/leerebruecke.png" class="logo-img"/>

    <div class="slot-area">

      <div class="arrow arrow-up" id="arrow-up"></div>

      <div class="slot-window">
        <div class="slot-list" id="slot-list">
          <!-- NEU: exakt 3x Wiederholung -->
          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>

          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>

          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>
        </div>
      </div>

      <div class="arrow arrow-down" id="arrow-down"></div>

    </div>

    <div class="section-area" id="section-area"></div>

  </div>
</div>

<script>

const base = ["Musik","Gemälde","Unterstützung"];
const texts = {
  Musik: "Dies ist ein Testtext für Musik.",
  Gemälde: "Dies ist ein Testtext für Gemälde.",
  Unterstützung: "Dies ist ein Testtext für Unterstützung."
};

const list = document.getElementById("slot-list");
const items = [...document.querySelectorAll(".slot-item")];
const out = document.getElementById("section-area");

const ITEM = 42;
const WINDOW = 84;   // doppelte Höhe → perfekte Mitte
const CENTER = (WINDOW - ITEM) / 2; // = 21

/* NEU: Start exakt auf Mitte der zweiten Wiederholung */
let visual = 3;  
let y = -(visual * ITEM) + CENTER;

list.style.transform = `translateX(-50%) translateY(${y}px)`;

/* ---------------- UPDATE ---------------- */

function update() {
  items.forEach(i => i.classList.remove("active"));
  items[visual].classList.add("active");

  const real = base[visual % 3];

  out.classList.remove("visible");
  requestAnimationFrame(() => {
    out.textContent = texts[real];
    out.classList.add("visible");
  });
}

/* ---------------- MOVE ---------------- */

let locked = false;
const LOCK = 220;

function move(dir) {
  if (locked) return;
  locked = true;
  setTimeout(() => locked = false, LOCK);

  visual += dir;
  y -= dir * ITEM;

  list.style.transition = "transform 170ms cubic-bezier(.32,.72,.23,1)";
  list.style.transform = `translateX(-50%) translateY(${y}px)`;

  setTimeout(() => {
    if (visual <= 2) {
      visual += 3;
      y += 3 * ITEM;
      list.style.transition = "none";
      list.style.transform = `translateX(-50%) translateY(${y}px)`;
      void list.offsetHeight;
      list.style.transition = "transform 170ms cubic-bezier(.32,.72,.23,1)";
    }
    if (visual >= 6) {
      visual -= 3;
      y -= 3 * ITEM;
      list.style.transition = "none";
      list.style.transform = `translateX(-50%) translateY(${y}px)`;
      void list.offsetHeight;
      list.style.transition = "transform 170ms cubic-bezier(.32,.72,.23,1)";
    }
    update();
  }, 170);
}

document.getElementById("arrow-up").onclick = () => move(-1);
document.getElementById("arrow-down").onclick = () => move(1);

/* TOUCH */
let startY = 0;

list.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
});

list.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].clientY - startY;
  if (diff > 40) move(-1);
  if (diff < -40) move(1);
});

/* WHEEL */
window.addEventListener("wheel", e => {
  if (e.deltaY > 0) move(1);
  else if (e.deltaY < 0) move(-1);
});

update();

</script>
</body>
</html>
