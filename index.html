<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leerebruecke</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-day: #e9e5dc;
      --bg-night: #15130f;
      --text-day: #1a1812;
      --text-night: #d5d2ca;
      --accent: #a89772;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'EB Garamond', serif;
      background-color: var(--bg-day);
      color: var(--text-day);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 1.5rem 2rem 0.5rem 2rem;
    }

    header img {
      width: 260px;
      height: auto;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2.2rem;
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: inherit;
      position: relative;
      transition: color 0.3s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 0%;
      height: 1px;
      background-color: currentColor;
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      max-width: 800px;
      margin: 0 auto;
    }

    h1, h2, p {
      margin: 0.6rem 0;
    }

    h2 {
      font-weight: 600;
      font-size: 1.5rem;
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.8;
      padding: 1rem 0 1.2rem 0;
      transition: opacity 0.3s ease;
    }

    footer:hover {
      opacity: 1;
    }

    .toggle-mode {
      position: fixed;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      font-size: 0.8rem;
      color: inherit;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .toggle-mode:hover {
      opacity: 1;
    }

    body.night {
      background-color: var(--bg-night);
      color: var(--text-night);
    }

    body.night nav a::after {
      background-color: var(--text-night);
    }
  </style>
</head>
<body>
  <button class="toggle-mode" onclick="toggleMode()">Nachtmodus</button>

  <header>
    <img src="bilder/titel_s.png" alt="leerebruecke logo" />
  </header>

  <nav>
    <a href="#klangwerke">Klangwerke</a>
    <a href="#schriftstuecke">Schriftstücke</a>
    <a href="#gemaelde">Gemälde</a>
    <a href="#geisterjaeger">Geisterjäger</a>
    <a href="#unterstuetzung">Unterstützung</a>
  </nav>

  <main>
    <h2>Eine schöpfende Ordensgemeinschaft der Leere</h2>
    <p>Willkommen bei leerebruecke.</p>
  </main>

  <footer>
    <p>© leerebruecke — Über | Unter</p>
  </footer>

  <script>
    function toggleMode() {
      const body = document.body;
      const button = document.querySelector('.toggle-mode');
      body.classList.toggle('night');
      button.textContent = body.classList.contains('night') ? 'Tagmodus' : 'Nachtmodus';
    }
  </script>
</body>
</html>
