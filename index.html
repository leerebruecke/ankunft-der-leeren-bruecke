<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root {
  --bg-root: #1a1218;
  --text-main: #f5f0e8;
}

/* RESET */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg-root);
  color: var(--text-main);
  font-family: 'Lucida Console', monospace;
  user-select: none;
  overflow: hidden;
}

body { display: flex; align-items: center; justify-content: center; }

/* FRAME */
.page-frame {
  position: relative;
  --base: min(100vh, 1200px);
  height: calc(var(--base) * 1.20);
  width: calc(var(--base) * 1.20 * 9/16);
  overflow: hidden;
}

.page-background {
  position: absolute;
  inset: 0;
  background-image: url("Grafiken/Br%C3%BCcke.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

/* CONTENT */
.page-content {
  position: absolute;
  inset: 0;
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo-img {
  width: 70%;
  margin-top: 0.2rem;
  margin-bottom: 1rem;
  image-rendering: pixelated;
}

@media (max-width: 768px) {
  .logo-img { margin-top: 10%; }
}

/* ----------------------------- SLOT ----------------------------- */

/* Slot 40px höher */
.slot-wrapper {
  margin-top: -40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* engerer Sichtbereich, weniger Leerlauf */
.slot-window {
  position: relative;
  width: 55%;
  height: 50px;
  overflow: hidden;

  mask-image: linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 12%,
    black 50%,
    rgba(0,0,0,0.85) 88%,
    transparent 100%
  );
}

/* Slot list */
.slot-list {
  position: absolute;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 170ms cubic-bezier(.32,.72,.23,1);
}

/* ITEMS */
.slot-item {
  height: 42px;
  font-size: 0.86rem;
  letter-spacing: 0.1em;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.20;
  transform: scale(0.85);
  transition: opacity 150ms, transform 150ms;
}

.slot-item.active {
  opacity: 1;
  transform: scale(1.05);
}

/* ARROWS */
.arrow {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  opacity: 0.75;
  cursor: pointer;
  transition: opacity 200ms;
}

.arrow:hover { opacity: 1; }

.arrow-up {
  border-bottom: 14px solid var(--text-main);
  margin-bottom: 4px;
}

.arrow-down {
  border-top: 14px solid var(--text-main);
  margin-top: 4px;
}

/* TEXT */
.section-area {
  margin-top: 1.2rem;
  font-size: 0.86rem;
  opacity: 0;
  transition: opacity 260ms ease-out;
}

.section-area.visible {
  opacity: 1;
}
</style>
</head>

<body>

<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">

    <img src="Grafiken/leerebruecke.png" class="logo-img"/>

    <div class="slot-wrapper">
      <div class="arrow arrow-up" id="arrow-up"></div>

      <div class="slot-window">
        <div class="slot-list" id="slot-list">

          <!-- 3 Blöcke für Loop -->
          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>

          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>

          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>

        </div>
      </div>

      <div class="arrow arrow-down" id="arrow-down"></div>
    </div>

    <div class="section-area" id="section-area"></div>

  </div>
</div>

<script>
/* BASIS */
const baseItems = ["Musik","Gemälde","Unterstützung"];

const texts = {
  Musik: "Dies ist ein Testtext für Musik.",
  Gemälde: "Dies ist ein Testtext für Gemälde.",
  Unterstützung: "Dies ist ein Testtext für Unterstützung."
};

const list = document.getElementById("slot-list");
const items = [...document.querySelectorAll(".slot-item")];
const out = document.getElementById("section-area");

const ITEM_HEIGHT = 42;
const WINDOW_HEIGHT = 50;

/* perfekter Zentrier-Offset */
const CENTER_OFFSET = (WINDOW_HEIGHT - ITEM_HEIGHT) / 2;  /* 4px */

/* Startposition = Mitte des Blocks */
let visualIndex = 4;
let translateY = -(visualIndex * ITEM_HEIGHT) + CENTER_OFFSET;

list.style.transform = `translateX(-50%) translateY(${translateY}px)`;

/* UPDATE */
function update() {
  items.forEach(i => i.classList.remove("active"));
  items[visualIndex].classList.add("active");

  const real = baseItems[(visualIndex % 3 + 3) % 3];

  out.classList.remove("visible");
  setTimeout(() => {
    out.textContent = texts[real];
    out.classList.add("visible");
  }, 80);
}

/* MOVE */
function doMove(dir) {
  visualIndex += dir;
  translateY -= dir * ITEM_HEIGHT;

  list.style.transition = "transform 170ms cubic-bezier(.32,.72,.23,1)";
  list.style.transform = `translateX(-50%) translateY(${translateY}px)`;

  /* Loop absolut flüssig */
  setTimeout(() => {
    if (visualIndex >= 7 || visualIndex <= 1) {
      visualIndex = 4;
      translateY = -(visualIndex * ITEM_HEIGHT) + CENTER_OFFSET;

      list.style.transition = "none";
      list.style.transform = `translateX(-50%) translateY(${translateY}px)`;

      requestAnimationFrame(() => {
        list.style.transition = "transform 170ms cubic-bezier(.32,.72,.23,1)";
      });
    }

    update();
  }, 200);   /* 200ms → kein Ruckeln */
}

function moveUp() { doMove(-1); }
function moveDown() { doMove(1); }

/* EVENTS */
document.getElementById("arrow-up").onclick = moveUp;
document.getElementById("arrow-down").onclick = moveDown;

/* TOUCH */
let startY = 0;

list.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
});

list.addEventListener("touchend", e => {
  const diff = e.changedTouches[0].clientY - startY;
  if (diff > 40) moveUp();
  if (diff < -40) moveDown();
});

/* INIT */
update();
</script>

</body>
</html>
