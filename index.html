<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leerebruecke</title>

<style>
/* Grundlayout */
body {
  margin: 0;
  font-family: 'Cormorant Garamond', serif;
  background-color: var(--bg);
  color: var(--text);
  transition: background-color 0.6s, color 0.6s;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

:root {
  --bg: #f0ebe3;
  --text: #1a1812;
  --accent: #1a1812;
}

body.dark {
  --bg: #1a1812;
  --text: #eae7e1;
}

/* Logo */
header img {
  display: block;
  margin: 40px auto 20px;
  width: 300px; /* +50% vergrößert */
  max-width: 80%;
}

/* Menü */
nav {
  text-align: center;
  margin-bottom: 40px;
}
nav ul {
  display: inline-block;
  list-style: none;
  padding: 0;
  margin: 0;
  text-align: left; /* Punkt 1: Zeilen linksbündig */
}
nav ul li {
  margin: 8px 0;
}
nav ul li a {
  color: var(--text);
  text-decoration: none;
  font-size: 1.1em;
}
nav ul li a:hover {
  text-decoration: underline;
}

/* Schriftstücke Dropdown */
.submenu {
  display: none;
  margin-top: 10px;
  animation: fadeIn 0.6s ease;
}
nav ul li.show .submenu {
  display: block;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(-5px);}
  to {opacity: 1; transform: translateY(0);}
}

/* Schriftstück-Inhalt */
#content {
  flex: 1;
  text-align: left;
  padding: 0 20px;
  max-width: 750px;
  margin: 0 auto;
  animation: fadeIn 0.6s ease;
}
#content h2 {
  font-weight: bold;
}

/* Footer fixiert */
footer {
  text-align: center;
  font-size: 0.8em;
  padding: 20px;
  margin-top: auto;
  position: relative;
}

/* Tag/Nachtmodus Button */
#modeToggle {
  position: fixed;
  top: 20px;
  right: 20px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.9em;
  background: none;
  border: 1px solid var(--text);
  color: var(--text);
  padding: 6px 12px;
  cursor: pointer;
}
#modeToggle:hover {
  background: var(--text);
  color: var(--bg);
}
</style>
</head>
<body>
<button id="modeToggle">Nachtmodus</button>

<header>
  <img src="bilder/titel_s.png" alt="leerebruecke Logo">
</header>

<nav>
  <ul>
    <li><a href="#">Klangwerke</a></li>
    <li id="schriftstuecke">
      <a href="#">Schriftstücke</a>
      <ul class="submenu">
        <li><a href="#" onclick="openText('Der Junge mit der Maske')">Der Junge mit der Maske</a></li>
        <li><a href="#" onclick="openText('Socken')">Socken</a></li>
      </ul>
    </li>
    <li><a href="#">Gemälde</a></li>
    <li><a href="#">Geisterjäger</a></li>
    <li><a href="#">Unterstützung</a></li>
  </ul>
</nav>

<main id="content"></main>

<footer>
  <p>© leerebruecke<br>Eine schöpfende Ordensgemeinschaft der Leere</p>
</footer>

<script>
const texts = {
  "Der Junge mit der Maske": `
  <h2>Der Junge mit der Maske</h2>
  <p>Er sitzt an der Kirchenmauer und betrachtet Insekten.
  Wie sie sich in nahegelegenes Unkraut stürzen, Gesteinsbrocken erklimmen und nach Liebe suchen.</p>
  <p>Seine Maske, Zeugin verschluckender Dunkelheit — lächelt breit und hemmungslos.
  Die Augen krankhaft aufgequollen.</p>
  <p>Und doch sitzt er da, an seiner Mauer und betrachtet mit einer ausserweltlichen Zärtlichkeit Insekten.
  Wie sie sich in nahegelegenes Unkraut stürzen, Gesteinsbrocken erklimmen und nach Liebe suchen.</p>
  <a href="#" onclick="goBack()">← zurück</a>`,

  "Socken": `
  <h2>Socken</h2>
  <p>Heute verdiene ich keine sauberen Socken.
  Nein, heute verdiene ich keine sauberen Socken.</p>
  <p>Gestern habe ich sie vielleicht noch verdient aber nicht heute.
  Es kann sein, dass ich sie wann anders verdient hätte aber heute nicht, heute bin ich nicht würdevoll genug.</p>
  <em>Und so zog er sich dreckige Socken an und verbrachte den Tag.</em>
  <a href="#" onclick="goBack()">← zurück</a>`
};

function openText(title) {
  document.querySelector("nav").style.display = "none";
  document.getElementById("content").innerHTML = texts[title];
}
function goBack() {
  document.querySelector("nav").style.display = "block";
  document.getElementById("content").innerHTML = "";
}

/* Dropdown toggle */
document.getElementById("schriftstuecke").addEventListener("click", function() {
  this.classList.toggle("show");
});

/* Nachtmodus Toggle */
const modeButton = document.getElementById("modeToggle");
modeButton.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  modeButton.textContent = document.body.classList.contains("dark") ? "Tagmodus" : "Nachtmodus";
});
</script>

</body>
</html>
