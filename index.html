<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root{
  --bg-root:#181818;
  --text-main:#f5f0e8;

  --ui-scale:1;

  --slot-nudge: 0px;

  /* NEW: move the whole slot mechanism down (arrows + window + word-list) */
  --slot-group-shift: 15px;

  /* NEW: slot animation duration (ms) – slowed ~30% */
  --slot-anim-ms:220;

  /* geometry base */
  --item-h-base:42px;
  --window-h-base:65px;

  /* size base */
  --arrow-size-base:14px;
  --slot-font-base:0.86rem;
  --text-font-base:0.86rem;

  /* derived */
  --item-h:calc(var(--item-h-base) * var(--ui-scale));
  --window-h:calc(var(--window-h-base) * var(--ui-scale));
  --arrow-size:calc(var(--arrow-size-base) * var(--ui-scale));
  --slot-font:calc(var(--slot-font-base) * var(--ui-scale));
  --text-font:calc(var(--text-font-base) * var(--ui-scale));

  --roll-lift-base:-40px;
  --roll-lift:calc(var(--roll-lift-base) * var(--ui-scale));

  /* slot width */
  --slot-w-min:240px;
  --slot-w-pref:62%;
  --slot-w-max:600px;

  /* typewriter */
  --type-char-ms:17;
  --type-jitter-ms:14;
  --fade-out-ms:120;

  /* icons */
  --icon-size-base:70px;
  --icon-size:calc(var(--icon-size-base) * var(--ui-scale));
  --icon-fade-ms:900ms;
  --post-min-delay-ms:90;
  --icon-rand-span-ms:180;

  /* icon pad */
  --icon-pad-color:var(--text-main);
  --icon-pad-radius:12px;

  /* email */
  --email-min-delay-ms:140;

  /* stable mask */
  --mask-grad:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--bg-root);
  color:var(--text-main);
  font-family:'Lucida Console',monospace;
  user-select:none;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}

body{
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

/* Blatt */
.scale-wrap{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow:hidden;
}

.scale-inner{
  width:810px;
  height:1440px;
  transform-origin:top center;
  transform:scale(var(--card-scale,1));
}

/* FRAME */
.page-frame{
  position:relative;
  width:810px;
  height:1440px;
  overflow:hidden;
  background:var(--bg-root);
}

.page-background{
  position:absolute;
  inset:0;
  background-color:var(--bg-root);
  background:url("Grafiken/Br%C3%BCcke.png") center/100% 100% no-repeat;
  image-rendering:pixelated;
}

/* CONTENT */
.page-content{
  position:absolute;
  inset:0;
  padding:1.1rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.logo-img{
  width:70%;
  margin-top:0.2rem;
  margin-bottom:1rem;
  image-rendering:pixelated;
}

/* SLOT */
.slot-group{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;

  /* shifted down by 15px via --slot-group-shift */
  transform:translateY(calc(var(--roll-lift) + var(--slot-group-shift)));
}

.slot-window{
  position:relative;
  width:clamp(var(--slot-w-min),var(--slot-w-pref),var(--slot-w-max));
  height:var(--window-h);
  overflow:hidden;
  flex-shrink:0;
  mask-image:var(--mask-grad);
  -webkit-mask-image:var(--mask-grad);
}

.slot-list{
  position:absolute;
  left:50%;
  transform:translateX(-50%) translateY(0);
  display:flex;
  flex-direction:column;
  align-items:center;
  will-change:transform;
}

.slot-item{
  height:var(--item-h);
  font-size:var(--slot-font);
  letter-spacing:0.1em;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.20;
  transform:scale(0.85);
  transition:opacity 150ms, transform 150ms;
  white-space:nowrap;
  padding:0 0.2rem;
}

.slot-item.active{
  opacity:1;
  transform:scale(1.05);
}

.arrow{
  width:0;height:0;
  border-left:var(--arrow-size) solid transparent;
  border-right:var(--arrow-size) solid transparent;
  opacity:0.75;
  cursor:pointer;
  transition:opacity 200ms;
  flex-shrink:0;
}

.arrow:hover{opacity:1;}

.arrow-up{
  border-bottom:var(--arrow-size) solid var(--text-main);
  margin-bottom:4px;
}

.arrow-down{
  border-top:var(--arrow-size) solid var(--text-main);
  margin-top:4px;
}

/* SECTION AREA */
.section-area{
  margin-top:1.2rem;
  font-size:var(--text-font);
  opacity:1;
  transition:opacity 260ms ease-out;
  width:min(85%,36rem);
  text-align:center;
  margin-inline:auto;
}

.section-area.fading{
  opacity:0;
  transition:opacity var(--fade-out-ms) ease-out;
}

.section-title{display:none;}

/* TOP EXTRAS */
.section-extras-top{ margin-bottom:0.65rem; }

/* BODY */
.section-body{ line-height:1.45; opacity:0.92; }

/* BOTTOM EXTRAS */
.section-extras-bottom{ margin-top:0.7rem; }

/* Seg base */
.seg{display:block;margin:0;padding:0;}
.seg-normal{opacity:0.92;}
.seg-italic{font-style:italic;opacity:0.78;}
.seg-aside{font-style:italic;opacity:0.55;}
.seg-attrib{
  font-style:italic;
  opacity:0.20;
  margin-top:0.25rem;
  text-align:center;
}

/* Centered LTR typewriter lines */
.tw-line{
  display:block;
  margin-inline:auto;
  text-align:left;
  white-space:pre;
}

/* ICON ROW CONTAINER */
.post-block{
  margin-top:0.25rem;
  display:flex;
  gap:calc(1rem * var(--ui-scale));
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
}

/* Icon button + Unterlage */
.icon-btn{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:var(--text-main);

  opacity:0;
  transform:translateY(2px);

  transition:
    opacity var(--icon-fade-ms) ease-out,
    transform var(--icon-fade-ms) ease-out;
  transition-delay: var(--ic-delay, 0ms);
}

.icon-btn::before{
  content:"";
  position:absolute;
  inset:23%;
  background:var(--icon-pad-color);
  border-radius:var(--icon-pad-radius);
  z-index:0;
}

.icon-btn img{
  position:relative;
  z-index:1;
  width:var(--icon-size);
  height:var(--icon-size);
  object-fit:contain;
  opacity:1;
  transform:none;
  animation:none;
  filter:none;
}

.icon-btn.visible{ opacity:1; transform:translateY(0); }

.icon-btn[data-label]::after{
  content:attr(data-label);
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%);
  font-size:0.68rem;
  letter-spacing:0.04em;
  white-space:nowrap;
  padding:0.22rem 0.4rem;
  border-radius:4px;
  background:rgba(0,0,0,0.55);
  color:var(--text-main);
  opacity:0;
  pointer-events:none;
  transition:opacity 140ms ease-out;
  z-index:2;
}
.icon-btn[data-label]:hover::after{ opacity:1; }

/* Email row */
.email-row{
  width:100%;
  display:flex;
  justify-content:center;

  opacity:0;
  transform:translateY(2px);
  transition:
    opacity var(--icon-fade-ms) ease-out,
    transform var(--icon-fade-ms) ease-out;
}
.email-row.visible{ opacity:1; transform:translateY(0); }

.email-row a{
  font-style:italic;
  opacity:0.78;
  letter-spacing:0.04em;
  text-decoration:none;
  color:var(--text-main);
}

.inline-link{
  color:#7aa8ff;
  text-decoration:underline;
  text-underline-offset:2px;
}

/* MOBILE */
@media (max-width: 768px){
  :root{
    --slot-nudge: 20px;

    /* slowed further on mobile too */
    --slot-anim-ms:300;

    --arrow-size-base:14px;
    --slot-font-base:1.35rem;
    --text-font-base:1.35rem;

    --slot-w-min:240px;
    --slot-w-pref:84%;
    --slot-w-max:560px;

    --icon-size-base:120px;

    --item-h-base:56px;
    --window-h-base:56px;
  }

  .logo-img{
    width:62%;
    margin-top:-0.25rem;
    margin-bottom:0.8rem;
  }

  .slot-group{
    transform:translateY(calc(var(--roll-lift) + var(--slot-group-shift))) scale(0.92);
  }

  .slot-item.active{
    transform:scale(1);
  }

  .slot-item{
    letter-spacing:0.07em;
    padding:0 0.1rem;
  }

  .section-area{
    margin-top:calc(0.9rem - 10px);
  }

  .page-background{ background-size:contain; }

  .arrow-up{ margin-bottom:-8px; }
  .arrow-down{ margin-top:20px; }

  .arrow{ pointer-events:none; }
  .icon-btn[data-label]::after{ display:none; }
}

@media (max-width: 420px){
  .slot-group{
    transform:translateY(calc(var(--roll-lift) + var(--slot-group-shift))) scale(0.92);
  }
}
</style>
</head>

/* ----------------------------- ELEMENTS ----------------------------- */

const $ = (sel, root=document) => root.querySelector(sel);

const list = $("#slot-list");
const out = $("#section-area");
const titleEl = $("#section-title");
const bodyEl = $("#section-body");
const extrasTop = $("#section-extras-top");
const extrasBottom = $("#section-extras-bottom");
const arrowUp = $("#arrow-up");
const arrowDown = $("#arrow-down");
const frame = $(".page-frame");
const slotWindow = $(".slot-window");
const scaleInner = $(".scale-inner");

/* ----------------------------- CSS HELPERS ----------------------------- */

const rootStyle = () => getComputedStyle(document.documentElement);
const cssNum = (name, fallback=0) => {
  const v = parseFloat(rootStyle().getPropertyValue(name));
  return Number.isFinite(v) ? v : fallback;
};

/* ----------------------------- GEOMETRY / SCALE ----------------------------- */

let BASE_Y = 0;
let STEP_Y = cssNum("--item-h", 42);
let CARD_SCALE = 1;

/* animation duration pulled from CSS */
let ANIM_MS = 220;
function updateAnimMs(){
  const v = cssNum("--slot-anim-ms", 220);
  ANIM_MS = Math.max(80, Math.min(900, v || 220));
}

function updateCardScale(){
  if (!scaleInner) return;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const baseW = 810;
  const baseH = 1440;
  const s = Math.min(vw / baseW, vh / baseH);
  CARD_SCALE = s || 1;
  scaleInner.style.setProperty("--card-scale", CARD_SCALE.toFixed(3));
}

/* Slot mittig verriegeln – robust gegen Mehrfach-Scaling */
function calcGeometry(){
  if (!slotWindow || !list.children.length) return;

  const items = list.children;
  if (items.length < 2) return;

  list.style.transition = "none";
  list.style.transform = "translateX(-50%) translateY(0px)";

  const centerItem = items[1];
  const belowItem  = items[2] || items[0];

  const winRect    = slotWindow.getBoundingClientRect();
  const centerRect = centerItem.getBoundingClientRect();
  const belowRect  = belowItem.getBoundingClientRect();

  const windowCenter = winRect.top + winRect.height / 2;
  const centerCenter = centerRect.top + centerRect.height / 2;
  const belowCenter  = belowRect.top + belowRect.height / 2;

  const winHcss = cssNum("--window-h", 65);
  let s = winHcss > 0 ? (winRect.height / winHcss) : (CARD_SCALE || 1);
  if (!Number.isFinite(s) || s <= 0.001) s = (CARD_SCALE || 1);

  BASE_Y = (windowCenter - centerCenter) / s;
  STEP_Y = (belowCenter - centerCenter) / s;

  if (!Number.isFinite(STEP_Y) || Math.abs(STEP_Y) < 1){
    STEP_Y = cssNum("--item-h", 42);
  }

  if (!Number.isFinite(BASE_Y)){
    const itemH = cssNum("--item-h", 42);
    const winH  = cssNum("--window-h", 65);
    const centerOffset = (winH - itemH) / 2;
    BASE_Y = -itemH + centerOffset;
  }

  BASE_Y += cssNum("--slot-nudge", 0);

  list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;
}

/* ----------------------------- TIMING/STATE ----------------------------- */

let busy = false;
let wheelAcc = 0;
const WHEEL_THRESHOLD = 30;
const WHEEL_CLAMP = 120;

let failTimer = null;

let typingTimer = null;
let typingToken = 0;

let iconsRevealTimer = null;
let emailRevealTimer = null;

function setBusy(){
  busy = true;
  clearTimeout(failTimer);
  failTimer = setTimeout(() => {
    busy = false;
    wheelAcc = 0;
  }, ANIM_MS + 140);
}

function clearBusy(){
  clearTimeout(failTimer);
  busy = false;
}

/* ----------------------------- UTIL ----------------------------- */

function resolvePageById(id){
  return PAGES.find(p => p.id === id) || { id, label:"", text:"" };
}

function orderedPages(centerId){
  const n = PAGES.length;
  const idx = Math.max(0, PAGES.findIndex(p => p.id === centerId));
  const prev = (idx - 1 + n) % n;
  const order = [];
  for (let i = 0; i < n; i++){
    order.push(PAGES[(prev + i) % n]);
  }
  return order;
}

function iconSrc(file){
  const s = String(file || "").trim();
  if (!s) return "";
  const lower = s.toLowerCase();
  if (lower.endsWith(".png")) return `Grafiken/${s.slice(0, -4)}.svg`;
  if (lower.endsWith(".svg")) return `Grafiken/${s}`;
  return `Grafiken/${s}`;
}

function iconBaseName(file){
  return String(file || "").trim().replace(/\.(png|svg)$/i,"");
}

function iconLabelFromFile(file){
  const base = iconBaseName(file);
  return base.replace(/[_\-]+/g," ");
}

/* ----------------------------- BUILD SLOT ----------------------------- */

function buildSlotItems(centerId="klang"){
  list.innerHTML = "";
  const frag = document.createDocumentFragment();

  orderedPages(centerId).forEach(p => {
    const div = document.createElement("div");
    div.className = "slot-item";
    div.textContent = p.label;
    div.dataset.pageId = p.id;
    frag.appendChild(div);
  });

  list.appendChild(frag);
}

/* ----------------------------- CLEANUP ----------------------------- */

function clearTyping(){
  typingToken++;

  if (typingTimer){
    clearTimeout(typingTimer);
    typingTimer = null;
  }

  clearTimeout(iconsRevealTimer);
  clearTimeout(emailRevealTimer);
  iconsRevealTimer = null;
  emailRevealTimer = null;
}

/* ----------------------------- SEGMENTS / TEXT ----------------------------- */

function buildSegments(page){
  const segs = [];
  const mainClass = page.italicAll ? "seg-italic" : "seg-normal";

  if (page.text){
    segs.push({ cls: mainClass, text: page.text, preBlank: 0, allowInline:false });
  }
  if (page.attrib){
    segs.push({ cls:"seg-attrib", text:`— ${page.attrib}`, preBlank:0, allowInline:false });
  }
  if (page.aside){
    let asideText = page.aside;

    if (page.testLinkWord && page.testLinkHref && typeof asideText === "string"){
      const word = page.testLinkWord;
      const href = page.testLinkHref;
      asideText = asideText.replace(
        new RegExp(`\\b${word}\\b`),
        `[[LINK:${word}|${href}]]`
      );
    }

    segs.push({ cls:"seg-aside", text: asideText, preBlank:1, allowInline:true });
  }

  return segs;
}

function measureCharWidthPx(){
  const probe = document.createElement("span");
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  probe.style.whiteSpace = "pre";
  probe.style.font = getComputedStyle(bodyEl).font;
  probe.style.fontSize = getComputedStyle(bodyEl).fontSize;
  probe.textContent = "MMMMMMMMMM";
  document.body.appendChild(probe);
  const w = probe.getBoundingClientRect().width / 10;
  probe.remove();
  return w || 8;
}

function computeMaxCharsPerLine(){
  const containerW = bodyEl.clientWidth || out.clientWidth || 300;
  const charW = measureCharWidthPx();
  const max = Math.floor(containerW / charW);
  return Math.max(12, max);
}

function extractInlineParts(text){
  const s = String(text || "");
  const parts = [];
  let i = 0;
  const re = /\[\[LINK:([^\]|]+)\|([^\]]+)\]\]/g;
  let m;

  while ((m = re.exec(s))){
    const start = m.index;
    if (start > i) parts.push({ type:"text", value:s.slice(i, start) });
    parts.push({ type:"link", value:m[1], href:m[2] });
    i = start + m[0].length;
  }
  if (i < s.length) parts.push({ type:"text", value:s.slice(i) });
  return parts;
}

function wrapParagraphToLines(paragraph, maxChars){
  const words = paragraph.split(/\s+/).filter(Boolean);
  if (!words.length) return [""];

  const lines = [];
  let line = "";

  const pushLine = () => { lines.push(line); line = ""; };

  for (const w of words){
    if (!line){
      if (w.length <= maxChars){
        line = w;
      } else {
        for (let i = 0; i < w.length; i += maxChars){
          lines.push(w.slice(i, i + maxChars));
        }
        line = "";
      }
      continue;
    }

    const candidate = line + " " + w;
    if (candidate.length <= maxChars){
      line = candidate;
    } else {
      pushLine();
      if (w.length <= maxChars){
        line = w;
      } else {
        for (let i = 0; i < w.length; i += maxChars){
          lines.push(w.slice(i, i + maxChars));
        }
        line = "";
      }
    }
  }

  if (line) lines.push(line);
  return lines;
}

function segmentToLineObjects(seg, maxChars){
  const outLines = [];

  if (seg.preBlank){
    for (let i = 0; i < seg.preBlank; i++){
      outLines.push({ cls: seg.cls, text: "", parts:null });
    }
  }

  const raw = String(seg.text || "");
  const paragraphs = raw.split("\n");

  paragraphs.forEach((p, idx) => {
    if (seg.allowInline && p.includes("[[LINK:")){
      const parts = extractInlineParts(p);
      const plainLen = parts.map(pt => pt.value || "").join("").length;

      if (plainLen <= maxChars){
        outLines.push({ cls: seg.cls, text: p, parts });
      } else {
        const cleaned = p.replace(/\[\[LINK:([^\]|]+)\|([^\]]+)\]\]/g, "$1");
        const lines = wrapParagraphToLines(cleaned, maxChars);
        lines.forEach(l => outLines.push({ cls: seg.cls, text: l, parts:null }));
      }
    } else {
      const lines = wrapParagraphToLines(p, maxChars);
      lines.forEach(l => outLines.push({ cls: seg.cls, text: l, parts:null }));
    }

    if (idx < paragraphs.length - 1){
      outLines.push({ cls: seg.cls, text: "", parts:null });
    }
  });

  return outLines;
}

function buildLinesDOMFromSegments(segs){
  bodyEl.innerHTML = "";

  const maxChars = computeMaxCharsPerLine();
  const lineObjs = [];
  segs.forEach(seg => lineObjs.push(...segmentToLineObjects(seg, maxChars)));

  const nodes = [];
  const frag = document.createDocumentFragment();

  lineObjs.forEach(lo => {
    const div = document.createElement("div");
    div.className = `tw-line seg ${lo.cls}`;

    let plain = lo.text ?? "";
    if (lo.parts){
      plain = lo.parts.map(pt => pt.value || "").join("");
    }

    const widthCh = Math.max(1, plain.length);
    div.style.width = widthCh + "ch";

    div.textContent = "";
    frag.appendChild(div);

    nodes.push({
      el: div,
      fullPlain: plain,
      parts: lo.parts || null
    });
  });

  bodyEl.appendChild(frag);
  return nodes;
}

function renderLinePartial(node, count){
  const el = node.el;

  if (!node.parts){
    el.textContent = node.fullPlain.slice(0, count);
    return;
  }

  const parts = node.parts;
  let remaining = count;

  el.innerHTML = "";

  for (const p of parts){
    const text = p.value || "";
    if (remaining <= 0) break;

    const take = Math.min(remaining, text.length);
    const chunk = text.slice(0, take);

    if (p.type === "link"){
      const a = document.createElement("a");
      a.href = p.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "inline-link";
      a.textContent = chunk;
      el.appendChild(a);
    } else {
      el.appendChild(document.createTextNode(chunk));
    }

    remaining -= take;
  }
}

/* ----------------------------- ICONS TOP ----------------------------- */

function buildIconRow(page){
  if (!Array.isArray(page.icons) || !page.icons.length) return null;

  const row = document.createElement("div");
  row.className = "post-block";

  page.icons.forEach(({file, href}) => {
    const img = document.createElement("img");
    img.src = iconSrc(file);
    img.alt = iconLabelFromFile(file);
    img.decoding = "async";
    img.loading = "eager";

    img.addEventListener("error", () => {
      const base = iconBaseName(file);
      const fallback = base ? `Grafiken/${base}.svg` : "";
      if (fallback && img.src !== fallback){
        img.src = fallback;
      }
    }, { once:true });

    const a = document.createElement("a");
    a.className = "icon-btn";
    a.dataset.label = iconLabelFromFile(file);

    const span = cssNum("--icon-rand-span-ms", 180);
    const rand = Math.floor(Math.random() * span);
    a.style.setProperty("--ic-delay", `${rand}ms`);

    if (href){
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    } else {
      a.href = "javascript:void(0)";
    }

    a.appendChild(img);
    row.appendChild(a);
  });

  return row;
}

function showIconsEarly(page){
  extrasTop.innerHTML = "";
  const row = buildIconRow(page);
  if (!row) return;

  extrasTop.appendChild(row);

  const btns = Array.from(row.querySelectorAll(".icon-btn"));
  const minDelay = cssNum("--post-min-delay-ms", 90);

  clearTimeout(iconsRevealTimer);

  iconsRevealTimer = setTimeout(() => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        btns.forEach(b => b.classList.add("visible"));
      });
    });
  }, minDelay);
}

/* ----------------------------- EMAIL BOTTOM ----------------------------- */

function buildEmailRow(page){
  if (!page.email) return null;

  const row = document.createElement("div");
  row.className = "email-row";

  const a = document.createElement("a");
  a.href = `mailto:${page.email}`;
  a.textContent = page.email;

  row.appendChild(a);
  return row;
}

function showEmailAfterTyping(page, token){
  if (token !== typingToken) return;

  extrasBottom.innerHTML = "";
  const row = buildEmailRow(page);
  if (!row) return;

  extrasBottom.appendChild(row);

  const minDelay = cssNum("--email-min-delay-ms", 140);

  clearTimeout(emailRevealTimer);
  emailRevealTimer = setTimeout(() => {
    requestAnimationFrame(() => row.classList.add("visible"));
  }, minDelay);
}

/* ----------------------------- PAGE SHOW ----------------------------- */

function typePage(page){
  clearTyping();
  titleEl.textContent = "";
  extrasTop.innerHTML = "";
  extrasBottom.innerHTML = "";
  bodyEl.innerHTML = "";

  showIconsEarly(page);

  const segs = buildSegments(page);
  if (!segs.length) return;

  const nodes = buildLinesDOMFromSegments(segs);
  const token = ++typingToken;

  const base = cssNum("--type-char-ms", 17);
  const jitter = cssNum("--type-jitter-ms", 14);

  let lineIndex = 0;
  let charIndex = 0;

  const step = () => {
    if (token !== typingToken) return;

    const current = nodes[lineIndex];
    if (!current){
      typingTimer = null;
      showEmailAfterTyping(page, token);
      return;
    }

    const fullLen = current.fullPlain.length;

    if (fullLen === 0){
      renderLinePartial(current, 0);
      lineIndex++;
      charIndex = 0;

      if (lineIndex >= nodes.length){
        typingTimer = null;
        showEmailAfterTyping(page, token);
        return;
      }
    } else {
      charIndex++;
      renderLinePartial(current, Math.min(charIndex, fullLen));

      if (charIndex >= fullLen){
        lineIndex++;
        charIndex = 0;

        if (lineIndex >= nodes.length){
          typingTimer = null;
          showEmailAfterTyping(page, token);
          return;
        }
      }
    }

    const rand = jitter ? (Math.random()*2 - 1) * jitter : 0;
    const delay = Math.max(10, base + rand);
    typingTimer = setTimeout(step, delay);
  };

  step();
}

function showPage(page){
  out.classList.add("fading");
  clearTyping();

  const fadeMs = cssNum("--fade-out-ms", 120);

  setTimeout(() => {
    out.classList.remove("fading");
    typePage(page);
  }, fadeMs);
}

/* ----------------------------- ACTIVE UPDATE ----------------------------- */

function updateActive(){
  Array.from(list.children).forEach(n => n.classList.remove("active"));

  const center = list.children[1];
  if (center) center.classList.add("active");

  const pageId = center?.dataset.pageId || "";
  showPage(resolvePageById(pageId));
}

/* ----------------------------- TRANSITION HELP ----------------------------- */

function withTransitionEnd(el, fn){
  const done = () => {
    el.removeEventListener("transitionend", done);
    el.removeEventListener("transitioncancel", done);
    fn();
  };
  el.addEventListener("transitionend", done, { once:true });
  el.addEventListener("transitioncancel", done, { once:true });
}

/* ----------------------------- MOVE LOGIC ----------------------------- */

function moveDown(){
  if (busy) return;
  setBusy();

  list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - STEP_Y}px)`;

  withTransitionEnd(list, () => {
    const first = list.firstElementChild;
    if (first) list.appendChild(first);

    list.style.transition = "none";
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    requestAnimationFrame(() => {
      updateActive();
      clearBusy();
    });
  });
}

function moveUp(){
  if (busy) return;
  setBusy();

  const last = list.lastElementChild;
  if (last) list.insertBefore(last, list.firstElementChild);

  list.style.transition = "none";
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - STEP_Y}px)`;
  void list.offsetHeight;

  requestAnimationFrame(() => {
    list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    withTransitionEnd(list, () => {
      updateActive();
      clearBusy();
    });
  });
}

/* ----------------------------- INPUT MODES ----------------------------- */

function applyInputMode(){
  const isMobile = matchMedia("(max-width: 768px)").matches;
  arrowUp.onclick = isMobile ? null : moveUp;
  arrowDown.onclick = isMobile ? null : moveDown;
}

/* ----------------------------- TOUCH SWIPE ----------------------------- */

let startY = 0;
let startX = 0;

frame.addEventListener("touchstart", e => {
  const t = e.touches[0];
  startY = t.clientY;
  startX = t.clientX;
}, { passive:true });

frame.addEventListener("touchend", e => {
  if (busy) return;

  const t = e.changedTouches[0];
  const dy = t.clientY - startY;
  const dx = t.clientX - startX;

  if (Math.abs(dx) > Math.abs(dy)) return;

  if (dy > 50) moveUp();
  if (dy < -50) moveDown();
}, { passive:true });

/* iOS: Multi-Touch (Pinch) so gut wie möglich unterbinden */
frame.addEventListener("touchstart", e => {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, { passive:false });
frame.addEventListener("touchmove", e => {
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, { passive:false });
document.addEventListener("gesturestart", e => e.preventDefault(), { passive:false });
document.addEventListener("gesturechange", e => e.preventDefault(), { passive:false });
document.addEventListener("gestureend", e => e.preventDefault(), { passive:false });

/* ----------------------------- WHEEL ----------------------------- */

frame.addEventListener("wheel", e => {
  e.preventDefault();
  if (busy) { wheelAcc = 0; return; }

  wheelAcc += e.deltaY;
  wheelAcc = Math.max(-WHEEL_CLAMP, Math.min(WHEEL_CLAMP, wheelAcc));

  if (Math.abs(wheelAcc) >= WHEEL_THRESHOLD){
    const dir = wheelAcc > 0 ? 1 : -1;
    wheelAcc = 0;
    dir > 0 ? moveDown() : moveUp();
  }
}, { passive:false });

/* ----------------------------- ICON PRELOAD (SVG) ----------------------------- */

function preloadIcons(){
  const files = new Set();

  PAGES.forEach(p => {
    (p.icons || []).forEach(ic => ic?.file && files.add(ic.file));
  });

  const loads = [];
  files.forEach(file => {
    loads.push(new Promise(res => {
      const img = new Image();
      img.onload = () => res(true);
      img.onerror = () => {
        const base = iconBaseName(file);
        if (base){
          img.src = `Grafiken/${base}.svg`;
          img.onload = () => res(true);
          img.onerror = () => res(false);
        } else {
          res(false);
        }
      };
      img.src = iconSrc(file);
    }));
  });

  return Promise.all(loads);
}

/* ----------------------------- INIT ----------------------------- */

buildSlotItems("klang");
updateAnimMs();
updateCardScale();
calcGeometry();
applyInputMode();

let resizeTimer = null;
window.addEventListener("resize", () => {
  applyInputMode();

  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    updateAnimMs();
    updateCardScale();
    calcGeometry();
    updateActive();
  }, 120);
});

preloadIcons().finally(() => {
  updateAnimMs();
  calcGeometry();
  updateActive();
});
</script>
