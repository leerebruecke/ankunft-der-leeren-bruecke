<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leerebruecke</title>
  <style>
    body {
      background-color: #1a1812;
      color: #D9D5CE;
      font-family: 'Times New Roman', serif;
      font-size: 120%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 2rem;
    }

    header img {
      width: 300px;
      height: auto;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 2rem 0;
    }

    nav a {
      text-decoration: none;
      color: #D9D5CE;
      transition: opacity 0.3s;
    }

    nav a:hover {
      opacity: 0.7;
    }

    footer {
      font-family: 'Jacquard 24', cursive;
      text-align: center;
      margin-top: auto;
      margin-bottom: 1rem;
      font-size: 0.9em;
      color: #D9D5CE;
    }

    footer a {
      text-decoration: none;
      color: #D9D5CE;
      margin: 0 0.5rem;
    }

    footer a:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>
    <img src="Grafiken/leerebruecke.png" alt="leerebruecke Logo" />
  </header>

  <nav>
    <a href="#">Musik</a>
    <a href="#">Schriftstücke</a>
    <a href="#">Gemälde</a>
    <a href="#">Unterstützung</a>
  </nav>

  <footer>
    <a href="#">Unter</a>
    <a href="#">Über</a><br />
    leerebruecke — eine schöpfende Ordensgemeinschaft der Leere
  </footer>
</body>
</html>
