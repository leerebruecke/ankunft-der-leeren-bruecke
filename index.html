<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leerebruecke</title>
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">
  <style>
    :root {
      --white: #e7e5e4;
      --black: #0c0c0c;
      --gray: #1a1816;
      --midgray: #2b2927;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--black);
      color: var(--white);
      font-family: 'Jacquard 12', serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      line-height: 1.6;
      letter-spacing: 0.03em;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem 2rem;
    }

    header img {
      width: 180px;
      max-width: 90%;
      opacity: 0.95;
    }

    nav {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      font-size: 1.5rem;
      text-align: left;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      padding: 0.2rem 0;
      transition: color 0.3s ease;
      align-self: flex-start;
      width: 100%;
      max-width: 200px;
    }

    nav a:hover {
      color: #bbb;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }

    main p {
      color: #ccc;
      max-width: 600px;
      margin-top: 1rem;
      font-size: 1rem;
    }

    footer {
      border-top: 1px solid var(--midgray);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: #aaa;
    }

    footer span {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #666;
    }

  </style>
</head>
<body>
  <header>
    <img src="Grafiken/leerebruecke.png" alt="Leerebruecke Logo" />
    <nav>
      <a href="#Klangwerke">Klangwerke</a>
      <a href="#Schriftstuecke">Schriftstücke</a>
      <a href="#Gemaelde">Gemälde</a>
      <a href="#Orden">Orden</a>
      <a href="#Unter">Unter</a>
    </nav>
  </header>

  <main>
    <p>Eine schöpfende Ordensgemeinschaft der Leere<br>zwischen Dunkelheit und Licht — formend, was bleibt.</p>
  </main>

  <footer>
    © Leerebruecke — Über | Unter
    <span>In stiller Ehrfurcht vor der Wahrheit</span>
  </footer>
</body>
</html>
