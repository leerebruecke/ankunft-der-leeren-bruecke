<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root{
  --bg-root:#1a1218;
  --text-main:#f5f0e8;

  /* geometry */
  --item-h:42px;
  --window-h:65px;

  /* sizes */
  --arrow-size:14px;
  --slot-font:0.86rem;
  --text-font:0.86rem;

  /* positioning */
  --roll-lift:-40px;

  /* slot width */
  --slot-w-min:240px;
  --slot-w-pref:62%;
  --slot-w-max:600px;

  /* typewriter (letter-based) */
  --type-char-ms:24;          /* leicht verschnellert */
  --type-jitter-ms:8;         /* lebendig, aber nicht nervös */
  --fade-out-ms:120;

  /* icons */
  --icon-size:70px;
  --icon-fade-ms:900ms;
  --post-min-delay-ms:90;     /* frühe Icons */
  --email-min-delay-ms:140;   /* kleine Atempause nach Text-Ende */

  --mask-grad:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--bg-root);
  color:var(--text-main);
  font-family:'Lucida Console',monospace;
  user-select:none;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* FRAME */
.page-frame{
  position:relative;
  --base:min(100svh,1200px);
  height:calc(var(--base)*1.20);
  width:calc(var(--base)*1.20*9/16);
  overflow:hidden;
}

.page-background{
  position:absolute;
  inset:0;
  background:url("Grafiken/Br%C3%BCcke.png") center/100% 100% no-repeat;
  image-rendering:pixelated;
}

/* CONTENT */
.page-content{
  position:absolute;
  inset:0;
  padding:1.1rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.logo-img{
  width:70%;
  margin-top:0.2rem;
  margin-bottom:1rem;
  image-rendering:pixelated;
}

/* SLOT */
.slot-group{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  transform:translateY(var(--roll-lift));
}

.slot-window{
  position:relative;
  width:clamp(var(--slot-w-min),var(--slot-w-pref),var(--slot-w-max));
  height:var(--window-h);
  overflow:hidden;
  flex-shrink:0;
  mask-image:var(--mask-grad);
  -webkit-mask-image:var(--mask-grad);
}

.slot-list{
  position:absolute;
  left:50%;
  transform:translateX(-50%) translateY(0);
  display:flex;
  flex-direction:column;
  align-items:center;
  will-change:transform;
}

.slot-item{
  height:var(--item-h);
  font-size:var(--slot-font);
  letter-spacing:0.1em;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.20;
  transform:scale(0.85);
  transition:opacity 150ms, transform 150ms;
  white-space:nowrap;
  padding:0 0.2rem;
}

.slot-item.active{
  opacity:1;
  transform:scale(1.05);
}

.arrow{
  width:0;height:0;
  border-left:var(--arrow-size) solid transparent;
  border-right:var(--arrow-size) solid transparent;
  opacity:0.75;
  cursor:pointer;
  transition:opacity 200ms;
  flex-shrink:0;
}

.arrow:hover{opacity:1;}

.arrow-up{
  border-bottom:var(--arrow-size) solid var(--text-main);
  margin-bottom:4px;
}

.arrow-down{
  border-top:var(--arrow-size) solid var(--text-main);
  margin-top:4px;
}

/* SECTION AREA */
.section-area{
  margin-top:1.2rem;
  font-size:var(--text-font);
  opacity:1;
  transition:opacity 260ms ease-out;
  width:min(85%,36rem);
  text-align:center;
  margin-inline:auto;
}

.section-area.fading{
  opacity:0;
  transition:opacity var(--fade-out-ms) ease-out;
}

.section-title{display:none;}

/* top extras */
.section-extras-top{
  margin-bottom:0.65rem;
}

/* text block stays within centered area, but types left-to-right */
.section-body{
  line-height:1.45;
  opacity:0.92;
  text-align:left;
}

/* bottom extras */
.section-extras-bottom{
  margin-top:0.7rem;
}

/* Segments for letter typing */
.seg{
  display:block;
  margin:0;
  padding:0;
  white-space:pre-line;
}
.seg-normal{opacity:0.92;}
.seg-italic{font-style:italic;opacity:0.78;}
.seg-aside{font-style:italic;opacity:0.55;}
.seg-attrib{
  font-style:italic;
  opacity:0.20;
  margin-top:0.25rem;
  text-align:center;
}

/* POST BLOCKS */
.post-block{
  margin-top:0.25rem;
  display:flex;
  gap:1rem;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;

  opacity:0;
  transform:translateY(2px);
  transition:
    opacity var(--icon-fade-ms) ease-out,
    transform var(--icon-fade-ms) ease-out;
}

.post-block.visible{
  opacity:1;
  transform:translateY(0);
}

.post-block a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:var(--text-main);
}

.post-block img{
  width:var(--icon-size);
  height:var(--icon-size);
  object-fit:contain;
  opacity:0.92;
}

.post-email{
  width:100%;
  justify-content:center;
  margin-top:0.15rem;
}

.post-email a{
  font-style:italic;
  opacity:0.78;
  letter-spacing:0.04em;
}

/* MOBILE */
@media (max-width: 768px){
  :root{
    --arrow-size:10px;
    --slot-font:0.74rem;
    --text-font:0.74rem;

    --slot-w-min:190px;
    --slot-w-pref:70%;
    --slot-w-max:400px;

    --icon-size:56px;
  }

  .logo-img{
    width:62%;
    margin-top:8%;
    margin-bottom:0.8rem;
  }

  .slot-group{
    transform:translateY(var(--roll-lift)) scale(0.82);
  }

  .section-area{
    margin-top:0.9rem;
  }

  .page-background{
    background-size:contain;
  }

  .arrow-up{margin-bottom:0;}
  .arrow-down{margin-top:0;}

  .arrow{pointer-events:none;}
}

@media (max-width: 420px){
  .slot-group{
    transform:translateY(var(--roll-lift)) scale(0.78);
  }
}
</style>
</head>

<body>
<div class="page-frame">

<script>
/* ----------------------------- PAGE DATA ----------------------------- */

const PAGES = [

`Keiner öffnet die Tür.

  },

  {

    text:
`Wer mit Ungeheuern kämpft, mag zusehen,

    attrib:"Nietzsche",

  },

  { id:"unter", label:"Unter", text:"Unter dir der Grund." },

  {
    id:"orden",
    label:"Leerebrücke",
    italicAll:true,
    text:"Ein mythopoietischer Orden."
  }
];

/* ----------------------------- ELEMENTS ----------------------------- */

const $ = (sel, root=document) => root.querySelector(sel);

const list = $("#slot-list");
const out = $("#section-area");
const titleEl = $("#section-title");
const bodyEl = $("#section-body");
const extrasTop = $("#section-extras-top");
const extrasBottom = $("#section-extras-bottom");
const arrowUp = $("#arrow-up");
const arrowDown = $("#arrow-down");
const frame = $(".page-frame");

/* ----------------------------- CSS HELPERS ----------------------------- */

const rootStyle = () => getComputedStyle(document.documentElement);
const cssNum = (name, fallback=0) => {
  const v = parseFloat(rootStyle().getPropertyValue(name));
  return Number.isFinite(v) ? v : fallback;
};

/* ----------------------------- GEOMETRY ----------------------------- */

let ITEM_HEIGHT, WINDOW_HEIGHT, CENTER_OFFSET, BASE_Y;

function calcGeometry(){
  ITEM_HEIGHT = cssNum("--item-h", 42);
  WINDOW_HEIGHT = cssNum("--window-h", 65);
  CENTER_OFFSET = (WINDOW_HEIGHT - ITEM_HEIGHT) / 2;
  BASE_Y = -(1 * ITEM_HEIGHT) + CENTER_OFFSET;

  list.style.transition = "none";
  list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;
}

/* ----------------------------- TIMING/STATE ----------------------------- */

const ANIM_MS = 170;

let busy = false;
let wheelAcc = 0;
const WHEEL_THRESHOLD = 30;
const WHEEL_CLAMP = 120;

let failTimer = null;

let typingTimer = null;
let typingToken = 0;

let iconsRevealTimer = null;
let emailRevealTimer = null;

/* ----------------------------- BUSY ----------------------------- */

function setBusy(){
  busy = true;
  clearTimeout(failTimer);
  failTimer = setTimeout(() => {
    busy = false;
    wheelAcc = 0;
  }, ANIM_MS + 140);
}

function clearBusy(){
  clearTimeout(failTimer);
  busy = false;
}

/* ----------------------------- UTIL ----------------------------- */

function resolvePageById(id){
  return PAGES.find(p => p.id === id) || { id, label:"", text:"" };
}

function orderedPages(centerId){
  const n = PAGES.length;
  const idx = Math.max(0, PAGES.findIndex(p => p.id === centerId));
  const prev = (idx - 1 + n) % n;
  const order = [];
  for (let i = 0; i < n; i++){
    order.push(PAGES[(prev + i) % n]);
  }
  return order;
}

/* ----------------------------- BUILD SLOT ----------------------------- */

function buildSlotItems(centerId="klang"){
  list.innerHTML = "";
  const frag = document.createDocumentFragment();

  orderedPages(centerId).forEach(p => {
    const div = document.createElement("div");
    div.className = "slot-item";
    div.textContent = p.label;
    div.dataset.pageId = p.id;
    frag.appendChild(div);
  });

  list.appendChild(frag);
}

/* ----------------------------- TYPEWRITER (LETTER) ----------------------------- */

function clearTyping(){
  typingToken++;

  if (typingTimer){
    clearTimeout(typingTimer);
    typingTimer = null;
  }

  clearTimeout(iconsRevealTimer);
  clearTimeout(emailRevealTimer);
  iconsRevealTimer = null;
  emailRevealTimer = null;
}

function buildSegments(page){
  const segs = [];
  const mainClass = page.italicAll ? "seg-italic" : "seg-normal";

  if (page.text){
    segs.push({ cls: mainClass, text: page.text, preBlank: 0 });
  }
  if (page.attrib){
    segs.push({ cls: "seg-attrib", text: `— ${page.attrib}`, preBlank: 0 });
  }
  if (page.aside){
    segs.push({ cls: "seg-aside", text: page.aside, preBlank: 1 });
  }

  return segs;
}

function buildSegmentsDOM(segs){
  bodyEl.innerHTML = "";
  const nodes = [];

  segs.forEach(s => {
    const div = document.createElement("div");
    div.className = `seg ${s.cls}`;

    const prefix = s.preBlank ? "\n".repeat(s.preBlank) : "";
    div.textContent = prefix;
    bodyEl.appendChild(div);

    nodes.push({ el: div, full: prefix + (s.text || "") });
  });

  return nodes;
}

/* ----------------------------- ICONS TOP (EARLY + SYNC) ----------------------------- */

function buildIconRow(page){
  if (!Array.isArray(page.icons) || !page.icons.length) return null;

  const row = document.createElement("div");
  row.className = "post-block";

  page.icons.forEach(({file, href}) => {
    const img = document.createElement("img");
    img.src = `Grafiken/${file}`;
    img.alt = file.replace(".png","");
    img.decoding = "async";
    img.loading = "eager";

    if (href){
      const a = document.createElement("a");
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.appendChild(img);
      row.appendChild(a);
    } else {
      row.appendChild(img);
    }
  });

  return row;
}

function showIconsEarly(page){
  extrasTop.innerHTML = "";
  const row = buildIconRow(page);
  if (!row) return;

  extrasTop.appendChild(row);

  const imgs = Array.from(row.querySelectorAll("img"));
  const decodes = imgs.map(img => {
    if (typeof img.decode === "function"){
      return img.decode().catch(() => {});
    }
    return Promise.resolve();
  });

  const minDelay = cssNum("--post-min-delay-ms", 90);

  Promise.all(decodes).finally(() => {
    iconsRevealTimer = setTimeout(() => {
      requestAnimationFrame(() => row.classList.add("visible"));
    }, minDelay);
  });
}

/* ----------------------------- EMAIL BOTTOM (AFTER TEXT) ----------------------------- */

function buildEmailRow(page){
  if (!page.email) return null;

  const mailRow = document.createElement("div");
  mailRow.className = "post-block post-email";

  const a = document.createElement("a");
  a.href = `mailto:${page.email}`;
  a.textContent = page.email;

  mailRow.appendChild(a);
  return mailRow;
}

function showEmailAfterTyping(page, token){
  if (token !== typingToken) return;

  extrasBottom.innerHTML = "";

  const row = buildEmailRow(page);
  if (!row) return;

  extrasBottom.appendChild(row);

  const minDelay = cssNum("--email-min-delay-ms", 140);
  emailRevealTimer = setTimeout(() => {
    requestAnimationFrame(() => row.classList.add("visible"));
  }, minDelay);
}

/* ----------------------------- PAGE SHOW ----------------------------- */

function typePage(page){
  clearTyping();
  titleEl.textContent = "";
  extrasTop.innerHTML = "";
  extrasBottom.innerHTML = "";
  bodyEl.innerHTML = "";

  showIconsEarly(page);

  const segs = buildSegments(page);
  if (!segs.length){
    return;
  }

  const nodes = buildSegmentsDOM(segs);
  const token = ++typingToken;

  const base = cssNum("--type-char-ms", 24);
  const jitter = cssNum("--type-jitter-ms", 8);

  let segIndex = 0;
  let charIndex = nodes[0]?.el.textContent.length || 0;

  const step = () => {
    if (token !== typingToken) return;

    const current = nodes[segIndex];
    if (!current){
      typingTimer = null;
      showEmailAfterTyping(page, token);
      return;
    }

    const full = current.full;

    charIndex++;
    current.el.textContent = full.slice(0, charIndex);

    if (charIndex >= full.length){
      segIndex++;
      const next = nodes[segIndex];
      charIndex = next ? (next.el.textContent.length || 0) : 0;

      if (segIndex >= nodes.length){
        typingTimer = null;
        showEmailAfterTyping(page, token);
        return;
      }
    }

    const rand = jitter ? (Math.random()*2-1) * jitter : 0;
    const delay = Math.max(12, base + rand);
    typingTimer = setTimeout(step, delay);
  };

  step();
}

function showPage(page){
  out.classList.add("fading");
  clearTyping();

  const fadeMs = cssNum("--fade-out-ms", 120);

  setTimeout(() => {
    out.classList.remove("fading");
    typePage(page);
  }, fadeMs);
}

/* ----------------------------- ACTIVE UPDATE ----------------------------- */

function updateActive(){
  Array.from(list.children).forEach(n => n.classList.remove("active"));

  const center = list.children[1];
  if (center) center.classList.add("active");

  const pageId = center?.dataset.pageId || "";
  showPage(resolvePageById(pageId));
}

/* ----------------------------- TRANSITION HELP ----------------------------- */

function withTransitionEnd(el, fn){
  const done = () => {
    el.removeEventListener("transitionend", done);
    el.removeEventListener("transitioncancel", done);
    fn();
  };
  el.addEventListener("transitionend", done, { once:true });
  el.addEventListener("transitioncancel", done, { once:true });
}

/* ----------------------------- MOVE LOGIC ----------------------------- */

function moveDown(){
  if (busy) return;
  setBusy();

  list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;

  withTransitionEnd(list, () => {
    const first = list.firstElementChild;
    if (first) list.appendChild(first);

    list.style.transition = "none";
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    requestAnimationFrame(() => {
      updateActive();
      clearBusy();
    });
  });
}

function moveUp(){
  if (busy) return;
  setBusy();

  const last = list.lastElementChild;
  if (last) list.insertBefore(last, list.firstElementChild);

  list.style.transition = "none";
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;
  void list.offsetHeight;

  requestAnimationFrame(() => {
    list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    withTransitionEnd(list, () => {
      updateActive();
      clearBusy();
    });
  });
}

/* ----------------------------- INPUT MODES ----------------------------- */

function applyInputMode(){
  const isMobile = matchMedia("(max-width: 768px)").matches;
  arrowUp.onclick = isMobile ? null : moveUp;
  arrowDown.onclick = isMobile ? null : moveDown;
}

/* ----------------------------- TOUCH SWIPE ----------------------------- */

let startY = 0;
let startX = 0;

frame.addEventListener("touchstart", e => {
  const t = e.touches[0];
  startY = t.clientY;
  startX = t.clientX;
}, { passive:true });

frame.addEventListener("touchend", e => {
  if (busy) return;

  const t = e.changedTouches[0];
  const dy = t.clientY - startY;
  const dx = t.clientX - startX;

  if (Math.abs(dx) > Math.abs(dy)) return;

  if (dy > 50) moveUp();
  if (dy < -50) moveDown();
}, { passive:true });

/* ----------------------------- WHEEL ----------------------------- */

frame.addEventListener("wheel", e => {
  e.preventDefault();
  if (busy) { wheelAcc = 0; return; }

  wheelAcc += e.deltaY;
  wheelAcc = Math.max(-WHEEL_CLAMP, Math.min(WHEEL_CLAMP, wheelAcc));

  if (Math.abs(wheelAcc) >= WHEEL_THRESHOLD){
    const dir = wheelAcc > 0 ? 1 : -1;
    wheelAcc = 0;
    dir > 0 ? moveDown() : moveUp();
  }
}, { passive:false });

/* ----------------------------- ICON PRELOAD ----------------------------- */

function preloadIcons(){
  const files = new Set();

  PAGES.forEach(p => {
    (p.icons || []).forEach(ic => ic?.file && files.add(ic.file));
  });

  const loads = [];
  files.forEach(file => {
    loads.push(new Promise(res => {
      const img = new Image();
      img.onload = () => res(true);
      img.onerror = () => res(false);
      img.src = `Grafiken/${file}`;
    }));
  });

  return Promise.all(loads);
}

/* ----------------------------- INIT ----------------------------- */

calcGeometry();
buildSlotItems("klang");
applyInputMode();

window.addEventListener("resize", () => {
  applyInputMode();
  calcGeometry();
});

/* Preload zuerst anstoßen, dann initiale Seite zeigen */
preloadIcons().finally(() => {
  list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;
  updateActive();
});
</script>
