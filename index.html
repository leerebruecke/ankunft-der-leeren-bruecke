
<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Icon-Test</title>
<style>
  body{
    background:#1a1218;
    color:white;
    font-family:monospace;
    padding:20px;
  }
  .icon-row{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:30px;
  }
  .icon-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  img{
    width:80px;
    height:80px;
    background:#333;
    padding:10px;
    border-radius:8px;
  }
</style>
</head>

<body>

<h1>SVG ICON TEST – DUMME VERSION</h1>

<div class="icon-row">
  <div class="icon-box">
    <img src="Grafiken/Spotify.svg" alt="Spotify"/>
    <div>Spotify</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/Apple_Music.svg" alt="Apple Music"/>
    <div>Apple Music</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/YouTube_Music.svg" alt="YouTube Music"/>
    <div>YouTube Music</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/PayPal.svg" alt="PayPal"/>
    <div>PayPal</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/Patreon.svg" alt="Patreon"/>
    <div>Patreon</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/TikTok.svg" alt="TikTok"/>
    <div>TikTok</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/Instagram.svg" alt="Instagram"/>
    <div>Instagram</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/YouTube.svg" alt="YouTube"/>
    <div>YouTube</div>
  </div>

  <div class="icon-box">
    <img src="Grafiken/Twitch.svg" alt="Twitch"/>
    <div>Twitch</div>
  </div>
</div>

</body>
</html>
