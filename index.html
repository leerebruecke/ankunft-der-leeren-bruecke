<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>leerebruecke</title>

  <style>
    :root {
      --bg-root: #1a1218;
      --text-main: #f5f0e8;
      --text-muted: #c6beb3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: var(--bg-root);
      color: var(--text-main);
      font-family: 'Courier New', monospace;
      user-select: none;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* -------------------------------------- */
    /* FRAME                                  */
    /* -------------------------------------- */

    .page-frame {
      position: relative;
      height: min(100vh, 1200px);
      width: calc(min(100vh, 1200px) * 9/16);
      max-width: 100vw;
      overflow: hidden;
      transform-origin: center;
    }

    /* -------------------------------------- */
    /* BACKGROUND                              */
    /* -------------------------------------- */

    .page-background {
      position: absolute;
      inset: 0;
      background-image: url("Grafiken/Br%C3%BCcke.png");
      background-size: 150%; /* +25 % */
      background-position: center;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      opacity: 1;
      pointer-events: none;
    }

    /* -------------------------------------- */
    /* CONTENT                                 */
    /* -------------------------------------- */

    .page-content {
      position: absolute;
      inset: 0;
      padding: 1.8rem 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img {
      width: 95%;
      height: auto;
      margin-bottom: 0.4rem;
      image-rendering: pixelated;
    }

    /* -------------------------------------- */
    /* MENU NEW SYSTEM                         */
    /* -------------------------------------- */

    .menu-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.28rem;
      margin-top: 0.2rem;
    }

    .menu-button {
      background: none;
      border: none;
      color: var(--text-main);
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 260ms ease-out, transform 260ms ease-out;
      padding: 0.2rem 0.5rem;
    }

    .menu-button.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* -------------------------------------- */
    /* CURRENT LABEL + BACK                    */
    /* -------------------------------------- */

    .current-label {
      margin-top: 0.4rem;
      font-size: 0.75rem;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 260ms ease-out, transform 260ms ease-out;
      letter-spacing: 0.1em;
    }

    .current-label.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .back-link {
      margin-top: 0.2rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 260ms ease-out, transform 260ms ease-out;
    }

    .back-link.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* -------------------------------------- */
    /* SECTION PANEL                           */
    /* -------------------------------------- */

    .sections {
      margin-top: 1rem;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .section {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 260ms ease-out, transform 260ms ease-out;
      font-size: 0.82rem;
      max-width: 430px;
      line-height: 1.33;
      text-align: center;
    }

    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }

  </style>
</head>
<body>

<div class="page-frame" id="page-frame">
  <div class="page-background"></div>

  <div class="page-content">
    <img src="Grafiken/leerebruecke.png" class="logo-img" draggable="false" />

    <ul class="menu-list" id="menu-list">
      <li><button class="menu-button" data-section="musik">Musik</button></li>
      <li><button class="menu-button" data-section="gemaelde">Gemälde</button></li>
      <li><button class="menu-button" data-section="unterstuetzung">Unterstützung</button></li>
    </ul>

    <div class="current-label" id="current-label"></div>
    <div class="back-link" id="back-link">Zurück</div>

    <div class="sections" id="sections">
      <div class="section" id="section-musik">Musik-Bereich</div>
      <div class="section" id="section-gemaelde">Gemälde-Bereich</div>
      <div class="section" id="section-unterstuetzung">Unterstützung-Bereich</div>
    </div>
  </div>
</div>

<script>
  const menuButtons = [...document.querySelectorAll('.menu-button')];
  const currentLabel = document.getElementById('current-label');
  const backLink = document.getElementById('back-link');
  const sections = {
    musik: document.getElementById('section-musik'),
    gemaelde: document.getElementById('section-gemaelde'),
    unterstuetzung: document.getElementById('section-unterstuetzung')
  };

  /* FADE-IN MENU */
  window.addEventListener('load', () => {
    menuButtons.forEach((btn, i) => {
      setTimeout(() => btn.classList.add('visible'), 420 + i * 210);
    });
  });

  function openSection(key, label) {
    currentLabel.textContent = label;

    menuButtons.forEach(btn => btn.classList.remove('visible'));

    setTimeout(() => {
      currentLabel.classList.add('visible');
      backLink.classList.add('visible');
    }, 260);

    Object.entries(sections).forEach(([k, sec]) => {
      if (k === key) setTimeout(() => sec.classList.add('visible'), 260);
      else sec.classList.remove('visible');
    });
  }

  function closeSection() {
    currentLabel.classList.remove('visible');
    backLink.classList.remove('visible');

    Object.values(sections).forEach(sec => sec.classList.remove('visible'));

    menuButtons.forEach((btn, i) => {
      setTimeout(() => btn.classList.add('visible'), 260 + i * 210);
    });
  }

  menuButtons.forEach(btn => {
    btn.addEventListener('click', () => openSection(btn.dataset.section, btn.textContent.trim()));
  });

  backLink.addEventListener('click', closeSection);

  /* Disable right-click */
  document.addEventListener('contextmenu', e => {
    if (e.target.closest('#page-frame')) e.preventDefault();
  });

</script>

</body>
</html>
