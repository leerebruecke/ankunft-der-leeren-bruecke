<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root{
  --bg-root:#1a1218;
  --text-main:#f5f0e8;

  /* geometry */
  --item-h: 42px;
  --window-h: 65px;

  /* sizes */
  --arrow-size: 14px;
  --slot-font: 0.86rem;
  --text-font: 0.86rem;

  /* positioning */
  --roll-lift: -40px;

  /* slot width */
  --slot-w-min: 220px;
  --slot-w-pref: 55%;
  --slot-w-max: 520px;
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--bg-root);
  color:var(--text-main);
  font-family:'Lucida Console',monospace;
  user-select:none;
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* FRAME */
.page-frame{
  position:relative;
  --base:min(100svh,1200px);
  height:calc(var(--base)*1.20);
  width:calc(var(--base)*1.20*9/16);
  overflow:hidden;
}

.page-background{
  position:absolute;
  inset:0;
  background-image:url("Grafiken/Br%C3%BCcke.png");
  background-repeat:no-repeat;
  background-position:center center;
  background-size:100% 100%;
  image-rendering:pixelated;
}

/* CONTENT */
.page-content{
  position:absolute;
  inset:0;
  padding:1.1rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.logo-img{
  width:70%;
  margin-top:0.2rem;
  margin-bottom:1rem;
  image-rendering:pixelated;
}

/* ----------------------------- SLOT ----------------------------- */

.slot-group{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  transform:translateY(var(--roll-lift));
}

.slot-window{
  position:relative;
  width:clamp(var(--slot-w-min), var(--slot-w-pref), var(--slot-w-max));
  height:var(--window-h);
  overflow:hidden;
  flex-shrink:0;

  mask-image:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
  -webkit-mask-image:linear-gradient(
    to bottom,
    transparent 0%,
    rgba(0,0,0,0.85) 22%,
    black 50%,
    rgba(0,0,0,0.85) 78%,
    transparent 100%
  );
}

.slot-list{
  position:absolute;
  left:50%;
  transform:translateX(-50%) translateY(0);
  display:flex;
  flex-direction:column;
  align-items:center;
  will-change:transform;
}

.slot-item{
  height:var(--item-h);
  font-size:var(--slot-font);
  letter-spacing:0.1em;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0.20;
  transform:scale(0.85);
  transition:opacity 150ms, transform 150ms;
  white-space:nowrap;
}

.slot-item.active{
  opacity:1;
  transform:scale(1.05);
}

.arrow{
  width:0;height:0;
  border-left:var(--arrow-size) solid transparent;
  border-right:var(--arrow-size) solid transparent;
  opacity:0.75;
  cursor:pointer;
  transition:opacity 200ms;
  flex-shrink:0;
}

.arrow:hover{opacity:1;}

.arrow-up{
  border-bottom:var(--arrow-size) solid var(--text-main);
  margin-bottom:4px;
}

.arrow-down{
  border-top:var(--arrow-size) solid var(--text-main);
  margin-top:4px;
}

.section-area{
  margin-top:1.2rem;
  font-size:var(--text-font);
  opacity:0;
  transition:opacity 260ms ease-out;
}

.section-area.visible{opacity:1;}

/* ----------------------------- MOBILE TUNING ----------------------------- */

@media (max-width: 768px){
  :root{
    --arrow-size: 10px;
    --slot-font: 0.74rem;
    --text-font: 0.74rem;

    --slot-w-min: 170px;
    --slot-w-max: 360px;
  }

  .logo-img{
    width:62%;
    margin-top:8%;
    margin-bottom:0.8rem;
  }

  /* keep your current overall mobile scale */
  .slot-group{
    transform:translateY(var(--roll-lift)) scale(0.82);
  }

  .section-area{
    margin-top:0.9rem;
  }

  /* stop background stretching on mobile */
  .page-background{
    background-size:contain;
  }

  /* Pfeile näher aneinander, ohne anderes Layout neu zu formen */
  .arrow-up{ margin-bottom:0px; }
  .arrow-down{ margin-top:0px; }

  /* Pfeile auf Mobile optisch da, aber nicht klickbar */
  .arrow{ pointer-events:none; }
}

/* very small phones */
@media (max-width: 420px){
  .slot-group{
    transform:translateY(var(--roll-lift)) scale(0.78);
  }
}
</style>
</head>

<body>

<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">

    <img src="Grafiken/leerebruecke.png" class="logo-img"/>

    <div class="slot-group">

      <div class="arrow arrow-up" id="arrow-up"></div>

      <div class="slot-window">
        <div class="slot-list" id="slot-list">
          <div class="slot-item">Musik</div>
          <div class="slot-item">Gemälde</div>
          <div class="slot-item">Unterstützung</div>
        </div>
      </div>

      <div class="arrow arrow-down" id="arrow-down"></div>

    </div>

    <div class="section-area" id="section-area"></div>

  </div>
</div>

<script>
/* DATA */
const texts = {
  Musik: "Dies ist ein Testtext für Musik.",
  Gemälde: "Dies ist ein Testtext für Gemälde.",
  Unterstützung: "Dies ist ein Testtext für Unterstützung."
};

/* ELEMENTS */
const list = document.getElementById("slot-list");
const out = document.getElementById("section-area");
const arrowUp = document.getElementById("arrow-up");
const arrowDown = document.getElementById("arrow-down");
const frame = document.querySelector(".page-frame");

/* GEOMETRY (must match CSS values) */
const ITEM_HEIGHT = 42;
const WINDOW_HEIGHT = 65;
const CENTER_OFFSET = (WINDOW_HEIGHT - ITEM_HEIGHT) / 2;

/* centered item is always the SECOND child */
const BASE_Y = -(1 * ITEM_HEIGHT) + CENTER_OFFSET;

/* TIMING */
const ANIM_MS = 170;

/* STATE */
let busy = false;
let wheelAcc = 0;
const WHEEL_THRESHOLD = 30;
const WHEEL_CLAMP = 120;

/* FAILSAFE */
let failTimer = null;
function setBusy() {
  busy = true;
  clearTimeout(failTimer);
  failTimer = setTimeout(() => {
    busy = false;
    wheelAcc = 0;
  }, ANIM_MS + 140);
}
function clearBusy() {
  clearTimeout(failTimer);
  busy = false;
}

/* INIT */
list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

/* ACTIVE + TEXT */
function updateActive(){
  const nodes = Array.from(list.children);
  nodes.forEach(n => n.classList.remove("active"));

  const centerNode = nodes[1];
  if (centerNode) centerNode.classList.add("active");

  const key = centerNode ? centerNode.textContent.trim() : "";

  out.classList.remove("visible");
  setTimeout(() => {
    out.textContent = texts[key] ?? "";
    out.classList.add("visible");
  }, 80);
}

/* MOVE DOWN (stable) */
function moveDown(){
  if (busy) return;
  setBusy();

  list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;

  const onEnd = () => {
    const first = list.firstElementChild;
    if (first) list.appendChild(first);

    list.style.transition = "none";
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    requestAnimationFrame(() => {
      updateActive();
      clearBusy();
    });
  };

  list.addEventListener("transitionend", onEnd, { once:true });
  list.addEventListener("transitioncancel", onEnd, { once:true });
}

/* MOVE UP (hardened) */
function moveUp(){
  if (busy) return;
  setBusy();

  const last = list.lastElementChild;
  if (last) list.insertBefore(last, list.firstElementChild);

  list.style.transition = "none";
  list.style.transform = `translateX(-50%) translateY(${BASE_Y - ITEM_HEIGHT}px)`;

  /* FORCE a layout read so the browser commits this state */
  void list.offsetHeight;

  /* Start animation back to BASE_Y */
  requestAnimationFrame(() => {
    list.style.transition = `transform ${ANIM_MS}ms cubic-bezier(.32,.72,.23,1)`;
    list.style.transform = `translateX(-50%) translateY(${BASE_Y}px)`;

    const onEnd = () => {
      updateActive();
      clearBusy();
    };

    list.addEventListener("transitionend", onEnd, { once:true });
    list.addEventListener("transitioncancel", onEnd, { once:true });
  });
}

/* CLICK ENABLE/DISABLE BY MODE */
function applyInputMode(){
  const isMobile = window.matchMedia("(max-width: 768px)").matches;

  if (isMobile){
    arrowUp.onclick = null;
    arrowDown.onclick = null;
  } else {
    arrowUp.onclick = moveUp;
    arrowDown.onclick = moveDown;
  }
}
applyInputMode();
window.addEventListener("resize", applyInputMode);

/* TOUCH - full screen swipe */
let startY = 0;
let startX = 0;

frame.addEventListener("touchstart", e => {
  const t = e.touches[0];
  startY = t.clientY;
  startX = t.clientX;
}, { passive:true });

frame.addEventListener("touchend", e => {
  if (busy) return;

  const t = e.changedTouches[0];
  const dy = t.clientY - startY;
  const dx = t.clientX - startX;

  if (Math.abs(dx) > Math.abs(dy)) return;

  if (dy > 50) moveUp();
  if (dy < -50) moveDown();
}, { passive:true });

/* WHEEL - whole frame */
frame.addEventListener("wheel", e => {
  e.preventDefault();
  if (busy) { wheelAcc = 0; return; }

  wheelAcc += e.deltaY;
  if (wheelAcc > WHEEL_CLAMP) wheelAcc = WHEEL_CLAMP;
  if (wheelAcc < -WHEEL_CLAMP) wheelAcc = -WHEEL_CLAMP;

  if (Math.abs(wheelAcc) >= WHEEL_THRESHOLD){
    const dir = wheelAcc > 0 ? 1 : -1;
    wheelAcc = 0;
    if (dir > 0) moveDown();
    else moveUp();
  }
}, { passive:false });

/* INIT RENDER */
updateActive();
</script>

</body>
</html>
