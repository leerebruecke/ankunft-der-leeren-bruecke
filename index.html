<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leerebruecke</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0908;
      --ink: #dcd6c8;
      --veil: #1a1812;
      --metal: #8f8775;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--black);
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      background: linear-gradient(90deg, transparent 0%, var(--veil) 50%, transparent 100%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header img {
      height: 42px;
      opacity: 0.85;
      transform: rotate(-1deg);
      transition: opacity 0.4s, transform 0.4s;
    }

    header img:hover {
      opacity: 1;
      transform: rotate(0deg) scale(1.02);
    }

    nav {
      display: flex;
      gap: 1.6rem;
      flex-wrap: wrap;
      font-family: 'Syne Mono', monospace;
      text-transform: lowercase;
      margin-left: auto;
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      transition: color 0.4s, letter-spacing 0.4s;
    }

    nav a:hover {
      color: var(--metal);
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8rem 2rem 4rem;
      text-align: center;
    }

    h1 {
      font-family: 'Syne Mono', monospace;
      font-size: clamp(2.5rem, 6vw, 6rem);
      letter-spacing: -0.03em;
      text-shadow: 0 0 10px var(--veil);
      animation: pulse 10s infinite alternate ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.9; letter-spacing: -0.02em; }
      50% { opacity: 1; letter-spacing: 0.05em; }
      100% { opacity: 0.9; letter-spacing: -0.02em; }
    }

    section {
      max-width: 900px;
      margin: 4rem auto;
      padding: 2rem;
      background-color: rgba(255,255,255,0.02);
      border: 1px solid var(--veil);
      border-radius: 2px;
      transform: rotate(-0.3deg);
    }

    section:hover {
      background-color: rgba(255,255,255,0.04);
      transform: rotate(0deg);
    }

    footer {
      text-align: center;
      padding: 1.2rem;
      font-size: 0.8rem;
      color: var(--metal);
      border-top: 1px solid var(--veil);
      font-family: 'Syne Mono', monospace;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <header>
    <img src="Grafiken/leerebruecke.png" alt="leerebruecke Logo">
    <nav>
      <a href="#klangwerke">klangwerke</a>
      <a href="#schriftstuecke">schriftstücke</a>
      <a href="#gemaelde">gemälde</a>
      <a href="#orden">orden</a>
      <a href="#unter">unter</a>
    </nav>
  </header>

  <main>
    <h1>leerebruecke</h1>
    <section>
      <p>eine schöpfende ordensgemeinschaft der leere. <br> wo worte, klänge und formen wie geister zurückkehren – als zeugen des ungesagten.</p>
    </section>
  </main>

  <footer>
    <p>© leerebruecke — über | unter</p>
  </footer>
</body>
</html>
