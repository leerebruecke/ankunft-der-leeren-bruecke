<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>leerebruecke</title>

<style>
:root {
  --bg-root: #1a1218;
  --text-main: #f5f0e8;
}

/* RESET */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: var(--bg-root);
  color: var(--text-main);
  font-family: 'Lucida Console', monospace;
  user-select: none;
  overflow: hidden;
}

body { display: flex; align-items: center; justify-content: center; }

/* FRAME */

.page-frame {
  position: relative;
  --base: min(100vh, 1200px);
  height: calc(var(--base) * 1.20);
  width: calc(var(--base) * 1.20 * 9/16);
  overflow: hidden;
}

.page-background {
  position: absolute;
  inset: 0;
  background-image: url("Grafiken/Br%C3%BCcke.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

/* CONTENT */

.page-content {
  position: absolute;
  inset: 0;
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo-img {
  width: 70%;
  margin-top: 0.2rem;
  margin-bottom: 1rem;
  image-rendering: pixelated;
}

@media (max-width: 768px) {
  .logo-img { margin-top: 10%; }
}

/* ------------------------ HARD VIEWPORT SLOT ------------------------ */

.slot-window {
  width: 55%;
  height: 38px;    /* nur EINE Zeile sichtbar */
  overflow: hidden; /* harte Kante */
  position: relative;
}

.slot-list {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  transition: top 180ms cubic-bezier(.32,.72,.23,1);
}

.slot-item {
  height: 38px;
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.22;
}

.slot-item.active {
  opacity: 1;
}

/* PFEILE */

.arrow {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  opacity: 0.75;
  cursor: pointer;
  transition: opacity 200ms;
}

.arrow:hover { opacity: 1; }

.arrow-up   { border-bottom: 14px solid var(--text-main); margin-bottom: 4px; }
.arrow-down { border-top: 14px solid var(--text-main);   margin-top: 4px;  }

/* TEXT */

.section-area {
  margin-top: 1.2rem;
  font-size: 0.86rem;
  opacity: 0;
  transition: opacity 260ms ease-out;
}
.section-area.visible { opacity: 1; }

</style>
</head>
<body>

<div class="page-frame">
  <div class="page-background"></div>

  <div class="page-content">

    <img src="Grafiken/leerebruecke.png" class="logo-img"/>

    <div class="arrow arrow-up" id="arrow-up"></div>

    <!-- HARD VIEWPORT -->
    <div class="slot-window">
      <div class="slot-list" id="slot-list">
        <!-- DUPLIERT FÜR REEL -->
        <div class="slot-item">Musik</div>
        <div class="slot-item">Gemälde</div>
        <div class="slot-item">Unterstützung</div>

        <div class="slot-item">Musik</div>
        <div class="slot-item">Gemälde</div>
        <div class="slot-item">Unterstützung</div>
      </div>
    </div>

    <div class="arrow arrow-down" id="arrow-down"></div>

    <div class="section-area" id="section-area"></div>

  </div>
</div>

<script>
const items = ["Musik","Gemälde","Unterstützung"];
const texts = {
  Musik: "Dies ist ein Testtext für Musik.",
  Gemälde: "Dies ist ein Testtext für Gemälde.",
  Unterstützung: "Dies ist ein Testtext für Unterstützung."
};

const slot = document.getElementById("slot-list");
const els = [...document.querySelectorAll(".slot-item")];
const textOut = document.getElementById("section-area");

let index = 0;
let topPos = 0;
const ITEM_HEIGHT = 38;
const SEGMENT = ITEM_HEIGHT;
const MAX = els.length;

/* UPDATE */

function update() {
  els.forEach(e => e.classList.remove("active"));
  els[index].classList.add("active");

  textOut.classList.remove("visible");
  setTimeout(() => {
    textOut.textContent = texts[items[index % 3]];
    textOut.classList.add("visible");
  }, 120);
}

/* MOVE */

function moveDown(){
  topPos -= SEGMENT;
  slot.style.top = topPos + "px";

  setTimeout(()=>{
    index = (index + 1) % 3;
    if(topPos <= -SEGMENT*3){
      topPos = 0;
      slot.style.top = "0px";
    }
    update();
  },180);
}

function moveUp(){
  topPos += SEGMENT;
  slot.style.top = topPos + "px";

  setTimeout(()=>{
    index = (index - 1 + 3) % 3;
    if(topPos > 0){
      topPos = -SEGMENT*2;
      slot.style.top = topPos + "px";
    }
    update();
  },180);
}

document.getElementById("arrow-up").onclick = moveUp;
document.getElementById("arrow-down").onclick = moveDown;

/* START */

update();
</script>

</body>
</html>
