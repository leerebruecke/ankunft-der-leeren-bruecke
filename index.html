<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>leerebruecke</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600&family=Cinzel:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --night-bg: #0f0d0b;
      --night-text: #d4cdbf;
      --accent: #8e7f56;
      --highlight: #a69b7b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--night-bg);
      color: var(--night-text);
      font-family: 'EB Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transition: background-color 1s ease, color 0.6s ease;
      letter-spacing: 0.03em;
    }

    header {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      padding: 1.5rem 2rem 0.5rem 2rem;
    }

    header img {
      width: 260px;
      height: auto;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-family: 'Cinzel', serif;
      text-transform: uppercase;
      font-size: 1rem;
      border-top: 1px solid var(--accent);
      border-bottom: 1px solid var(--accent);
      padding: 1rem 0;
      margin-bottom: 2rem;
      width: 90%;
      max-width: 900px;
    }

    nav a {
      text-decoration: none;
      color: var(--night-text);
      transition: color 0.4s ease;
    }

    nav a:hover {
      color: var(--highlight);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 800px;
      padding: 0 2rem;
    }

    main h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      color: var(--highlight);
    }

    footer {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.7;
      padding: 1rem;
      width: 100%;
      border-top: 1px solid var(--accent);
      margin-top: 2rem;
    }

    footer:hover {
      opacity: 1;
    }

    .ornament {
      width: 40px;
      height: 2px;
      background-color: var(--accent);
      margin: 1rem auto;
    }

    a.btn {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      margin-top: 1rem;
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--highlight);
      text-decoration: none;
      transition: all 0.4s ease;
      font-family: 'Cinzel', serif;
    }

    a.btn:hover {
      background-color: var(--accent);
      color: var(--night-bg);
    }
  </style>
</head>
<body>
  <header>
    <img src="Grafiken/leerebruecke.png" alt="leerebruecke Logo" />
  </header>

  <nav>
    <a href="#klangwerke">Klangwerke</a>
    <a href="#schriftstuecke">Schriftstücke</a>
    <a href="#gemaelde">Gemälde</a>
    <a href="#geisterjaeger">Geisterjäger</a>
    <a href="#unterstuetzung">Unterstützung</a>
  </nav>

  <main>
    <h2>Eine schöpfende Ordensgemeinschaft der Leere</h2>
    <div class="ornament"></div>
    <p>Hier ruht der Ursprung des Werkes, in Stille, Dunkelheit und Klang. Jede Brücke führt in die Leere, und aus ihr wird geschaffen.</p>
    <a class="btn" href="#entdecken">Eintreten</a>
  </main>

  <footer>
    <p>© leerebruecke — Über | Unter</p>
  </footer>
</body>
</html>
