<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>leerebruecke</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    img {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    #bg {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        top: 0;
        left: 0;
        z-index: 1;
    }

    #title {
        position: absolute;
        top: 3vh;
        left: 50%;
        transform: translateX(-50%);
        width: 60%;
        z-index: 3;
        image-rendering: pixelated;
    }

    @font-face {
        font-family: "Jaquard12";
        src: url("Grafiken/Jaquard12.ttf") format("truetype");
    }

    #menu {
        position: absolute;
        top: 20vh;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        opacity: 0;
        transition: opacity 1.2s ease;
        z-index: 4;
    }

    .menu-item {
        font-family: "Jaquard12", monospace;
        color: #e6e6e6;
        font-size: 3.6vh;
        margin: 2.2vh 0;
        cursor: pointer;
        user-select: none;
        transition: opacity 0.4s ease, transform 1.0s ease;
    }

    /* Bereich für späteren Text */
    #content {
        position: absolute;
        top: 40vh;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        color: #dcdcdc;
        font-family: "Jaquard12", monospace;
        font-size: 2.4vh;
        text-align: center;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 4;
    }
</style>

</head>
<body>

<img id="bg" src="Grafiken/Brücke.png">
<img id="title" src="Grafiken/leerebruecke.png">

<div id="menu">
    <div class="menu-item" onclick="choose(this, 'musik')">Musik</div>
    <div class="menu-item" onclick="choose(this, 'gemaelde')">Gemälde</div>
    <div class="menu-item" onclick="choose(this, 'unterstuetzung')">Unterstützung</div>
</div>

<div id="content"></div>

<script>
    /* Menü sanft einblenden */
    window.onload = () => {
        setTimeout(() => {
            document.getElementById("menu").style.opacity = 1;
        }, 900);
    };

    function choose(clickedItem, section) {
        const menu = document.getElementById("menu");
        const items = document.querySelectorAll(".menu-item");

        /* Andere Punkte ausblenden */
        items.forEach(item => {
            if (item !== clickedItem) {
                item.style.opacity = 0;
            }
        });

        /* Gewählten Punkt nach oben ziehen */
        clickedItem.style.transform = "translateY(-12vh)";

        /* Wenn er oben angekommen ist, Content zeigen */
        setTimeout(() => {
            showContent(section);
        }, 900);
    }

    function showContent(section) {
        const content = document.getElementById("content");

        let text = "";
        if (section === "musik") {
            text = "Hier entsteht der Pfad zur Musik.";
        } else if (section === "gemaelde") {
            text = "Hier entsteht der Pfad zu den Gemälden.";
        } else if (section === "unterstuetzung") {
            text = "Hier entsteht der Pfad zur Unterstützung.";
        }

        content.innerText = text;
        content.style.opacity = 1;
    }
</script>

</body>
</html>
